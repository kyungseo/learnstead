<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1084" width="880" height="1084" role="img" font-family="Pretendard, Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<title>다섯 방식은 호출의 연결과 선택이 다르다</title><desc>단일은 모든 문서를 한 호출에 넣는다. 파이프라인은 정해진 순서대로 실행한다. 라우터는 담당 하나를 선택한다. 워커는 코드가 미리 정한 문서별 작업을 분배하고 취합한다. 평가 개선은 평가 후 통과하거나 상한에서 멈추고, 미달하면 다시 작성한다.</desc>
