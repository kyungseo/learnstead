<text x="24" y="33" font-size="26" font-weight="700" text-anchor="start" dominant-baseline="central" data-fill-role="ink" fill="#252B35">다섯 방식은 호출의 연결과 선택이 다르다</text>
<text x="24" y="65" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="central" data-fill-role="muted" fill="#636A75">같은 과제의 비교 구성 · 모든 Agent 패턴을 나열한 목록은 아님</text>
