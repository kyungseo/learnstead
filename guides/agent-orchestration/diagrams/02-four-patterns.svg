<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>네 가지 오케스트레이션 패턴</title>
  <desc>이 가이드의 대표 네 구성은 파이프라인, 라우터, 워커 분배와 취합, 평가 루프다. 전체 패턴 목록이 아니며 실습의 워커 작업은 코드가 고정한다.</desc>
