<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>컨텍스트 격리 — 각 호출에 필요한 자료만 전달하기</title>
  <desc>같은 단일 질문의 2026-08-30 측정이다. 단일 입력 508, 워커 입력 197·230·205와 취합 150의 합계는 782다. 전달 정보의 경계와 전체 토큰 비용을 구분한다.</desc>

  <rect x="0" y="0" width="680" height="330" data-fill-role="surface" fill="#FFFFFF"/>
  <rect x="24" y="13" width="3" height="22" rx="1.5" data-fill-role="focus" fill="#2E6DA4" />
  <text x="36" y="24" font-size="18" font-weight="700" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">입력 경계와 전체 토큰 비용을 따로 본다</text>
  <text x="36" y="46" font-size="11.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">전달 자료로 경계를 확인하고, prompt_tokens로 입력 크기를 비교한다</text>
  <rect x="24" y="70" width="304" height="158" rx="12" data-fill-role="data-fill" fill="#F4F5F5" data-stroke-role="data-line" stroke="#636A75" stroke-width="1" />
  <text x="40" y="88" font-size="13" font-weight="700" data-fill-role="data-ink" fill="#363A40" text-anchor="start" dominant-baseline="central">격리 없음</text>
  <rect x="40" y="104" width="272" height="44" rx="9" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="data-line" stroke="#636A75" stroke-width="1" />
  <text x="176.0" y="118.0" font-size="12" font-weight="700" data-fill-role="data-ink" fill="#363A40" text-anchor="middle" dominant-baseline="central">모델 1회</text>
  <text x="176.0" y="132.0" font-size="10" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">문서 A + B + C + 질문</text>
  <text x="176" y="176" font-size="13" font-weight="700" data-fill-role="data-ink" fill="#363A40" text-anchor="middle" dominant-baseline="central">입력 508 토큰</text>
  <text x="176" y="202" font-size="10" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">단일 질문 · 2026-08-30 실측</text>
  <rect x="352" y="70" width="304" height="158" rx="12" data-fill-role="compute-fill" fill="#ECF4F1" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="368" y="88" font-size="13" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="start" dominant-baseline="central">격리 있음</text>
  <rect x="368" y="100" width="200" height="26" rx="5" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="378" y="113" font-size="10.5" data-fill-role="compute-ink" fill="#234F3F" text-anchor="start" dominant-baseline="central">워커A ← 문서 A</text>
  <text x="596" y="113" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="end" dominant-baseline="central">197</text>
  <rect x="368" y="130" width="200" height="26" rx="5" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="378" y="143" font-size="10.5" data-fill-role="compute-ink" fill="#234F3F" text-anchor="start" dominant-baseline="central">워커B ← 문서 B</text>
  <text x="596" y="143" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="end" dominant-baseline="central">230</text>
  <rect x="368" y="160" width="200" height="26" rx="5" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="378" y="173" font-size="10.5" data-fill-role="compute-ink" fill="#234F3F" text-anchor="start" dominant-baseline="central">워커C ← 문서 C</text>
  <text x="596" y="173" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="end" dominant-baseline="central">205</text>
  <rect x="368" y="192" width="272" height="28" rx="6" data-fill-role="compute-fill" fill="#ECF4F1" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="378" y="206" font-size="10.5" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="start" dominant-baseline="central">상위 ← 결과만 (원문 아님)</text>
  <text x="632" y="206" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="end" dominant-baseline="central">150</text>
  <rect x="24" y="244" width="632" height="62" rx="12" data-fill-role="warning-fill" fill="#FAF3E6" data-stroke-role="warning-line" stroke="#B08434" stroke-width="1" />
  <text x="340" y="264" font-size="11.5" font-weight="700" data-fill-role="warning-ink" fill="#6B4F1A" text-anchor="middle" dominant-baseline="central">입력을 나눠도 전체 토큰은 늘 수 있다</text>
  <text x="340" y="288" font-size="11" data-fill-role="ink" fill="#252B35" text-anchor="middle" dominant-baseline="central">파이프라인 508 → 365 (↓)          워커 508 → 782 (↑)          평가 루프 508 → 1,043 (↑)</text>
  <text x="340.0" y="318" font-size="11" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">상위의 원문 재검증은 필요성과 추가 비용을 함께 확인한다</text>
</svg>
