  <text x="340.0" y="314" font-size="11" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">구성을 바꿨다면 기존 방식과 토큰·정확도·시간을 비교해 유지할지 판단한다</text>
