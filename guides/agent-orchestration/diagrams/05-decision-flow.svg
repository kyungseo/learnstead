  <path d="M520 93 L534 93" fill="none" data-stroke-role="warning-line" stroke="#B08434" stroke-width="1.5" marker-end="url(#ah-warning-line-1_5)"/>
  <rect x="540" y="74" width="116" height="38" rx="7" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="warning-line" stroke="#B08434" stroke-width="1" />
  <text x="550" y="93" font-size="10" font-weight="700" data-fill-role="warning-ink" fill="#6B4F1A" text-anchor="start" dominant-baseline="central">라우터+폴백</text>
  <path d="M306 168 Q322 168 336 93" fill="none" data-stroke-role="data-line" stroke="#636A75" stroke-width="1.5" marker-end="url(#ah-data-line-1_5)"/>
  <rect x="340" y="122" width="176" height="38" rx="7" data-fill-role="edge-fill" fill="#EAF0F6" data-stroke-role="edge-line" stroke="#2E6DA4" stroke-width="1" />
  <text x="350" y="141" font-size="10" data-fill-role="edge-ink" fill="#193C5A" text-anchor="start" dominant-baseline="central">컨텍스트 초과 + 순서 있음</text>
  <path d="M520 141 L534 141" fill="none" data-stroke-role="edge-line" stroke="#2E6DA4" stroke-width="1.5" marker-end="url(#ah-edge-line-1_5)"/>
