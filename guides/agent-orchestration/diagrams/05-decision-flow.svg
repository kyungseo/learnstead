  <text x="350" y="189" font-size="10" data-fill-role="edge-ink" fill="#193C5A" text-anchor="start" dominant-baseline="central">대상 여럿 · 동시에</text>
  <path d="M520 189 L534 189" fill="none" data-stroke-role="edge-line" stroke="#2E6DA4" stroke-width="1.5" marker-end="url(#ah-edge-line-1_5)"/>
  <rect x="540" y="170" width="116" height="38" rx="7" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="edge-line" stroke="#2E6DA4" stroke-width="1" />
  <text x="550" y="189" font-size="10" font-weight="700" data-fill-role="edge-ink" fill="#193C5A" text-anchor="start" dominant-baseline="central">워커 병렬</text>
  <path d="M306 168 Q322 168 336 189" fill="none" data-stroke-role="data-line" stroke="#636A75" stroke-width="1.5" marker-end="url(#ah-data-line-1_5)"/>
  <rect x="340" y="218" width="176" height="38" rx="7" data-fill-role="warning-fill" fill="#FAF3E6" data-stroke-role="warning-line" stroke="#B08434" stroke-width="1" />
  <text x="350" y="237" font-size="10" data-fill-role="warning-ink" fill="#6B4F1A" text-anchor="start" dominant-baseline="central">품질 모자람 + 기준 명확</text>
  <path d="M520 237 L534 237" fill="none" data-stroke-role="warning-line" stroke="#B08434" stroke-width="1.5" marker-end="url(#ah-warning-line-1_5)"/>
  <rect x="540" y="218" width="116" height="38" rx="7" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="warning-line" stroke="#B08434" stroke-width="1" />
  <text x="550" y="237" font-size="10" font-weight="700" data-fill-role="warning-ink" fill="#6B4F1A" text-anchor="start" dominant-baseline="central">평가 루프+상한</text>
  <path d="M306 168 Q322 168 336 237" fill="none" data-stroke-role="data-line" stroke="#636A75" stroke-width="1.5" marker-end="url(#ah-data-line-1_5)"/>
  <rect x="340" y="266" width="176" height="38" rx="7" data-fill-role="danger-fill" fill="#F9ECEA" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="1" />
  <text x="350" y="285" font-size="10" data-fill-role="danger-ink" fill="#6E2F28" text-anchor="start" dominant-baseline="central">품질 모자람 + 기준 모호</text>
  <path d="M520 285 L534 285" fill="none" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="1.5" marker-end="url(#ah-danger-line-1_5)"/>
  <rect x="540" y="266" width="116" height="38" rx="7" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="1" />
  <text x="550" y="285" font-size="10" font-weight="700" data-fill-role="danger-ink" fill="#6E2F28" text-anchor="start" dominant-baseline="central">요청·근거를 정리</text>
