<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" width="680" height="390" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>AI Agent의 실행 구조 — 모델은 제안하고 runtime이 실행한다</title>
  <desc>사용자의 목표가 Agent Runtime으로 들어가고, runtime이 모델에 판단을 요청한 뒤 허용된 도구를 실행하고 결과를 다시 모델에 전달하는 반복 구조. Skills는 절차, MCP는 능력, Context Engineering은 모델이 볼 정보, Harness는 권한과 완료 조건을 관리한다.</desc>
  <defs>
    <marker id="arrow-edge" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" data-stroke-role="edge-line" stroke="#2E6DA4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-compute" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-api" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" data-stroke-role="api-line" stroke="#5B54A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-warning" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" data-stroke-role="warning-line" stroke="#B08434" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="390" data-fill-role="surface" fill="#FFFFFF"/>
  <rect x="24" y="13" width="3" height="22" rx="1.5" data-fill-role="focus" fill="#2E6DA4"/>
  <text x="36" y="24" font-size="18" font-weight="700" data-fill-role="ink" fill="#252B35" dominant-baseline="central">AI Agent는 모델 하나가 아니라 실행 구조다</text>
  <text x="36" y="46" font-size="11.5" data-fill-role="muted" fill="#636A75" dominant-baseline="central">모델은 다음 행동을 제안하고, runtime과 도구가 권한 안에서 실제 작업을 수행한다</text>

  <rect x="24" y="82" width="128" height="62" rx="12" data-fill-role="data-fill" fill="#F4F5F5" data-stroke-role="data-line" stroke="#636A75" stroke-width="1.2"/>
  <text x="88" y="104" font-size="12.5" font-weight="700" data-fill-role="data-ink" fill="#363A40" text-anchor="middle" dominant-baseline="central">사용자</text>
  <text x="88" y="126" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">목표 · 제약 · 승인</text>

  <rect x="214" y="72" width="252" height="170" rx="16" data-fill-role="edge-fill" fill="#EAF0F6" data-stroke-role="edge-line" stroke="#2E6DA4" stroke-width="1.4"/>
  <text x="340" y="96" font-size="14" font-weight="700" data-fill-role="edge-ink" fill="#193C5A" text-anchor="middle" dominant-baseline="central">Agent Runtime</text>
  <rect x="238" y="116" width="204" height="44" rx="10" fill="#FFFFFF" data-stroke-role="edge-line" stroke="#2E6DA4" stroke-width="1"/>
  <text x="340" y="138" font-size="11.5" font-weight="700" data-fill-role="edge-ink" fill="#193C5A" text-anchor="middle" dominant-baseline="central">현재 상태와 도구 목록 조립</text>
  <rect x="238" y="172" width="204" height="44" rx="10" fill="#FFFFFF" data-stroke-role="edge-line" stroke="#2E6DA4" stroke-width="1"/>
  <text x="340" y="194" font-size="11.5" font-weight="700" data-fill-role="edge-ink" fill="#193C5A" text-anchor="middle" dominant-baseline="central">호출 검사 · 실행 · 결과 연결</text>
  <text x="340" y="228" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">완료·실패·중지 조건까지 반복</text>

  <rect x="528" y="82" width="128" height="62" rx="12" data-fill-role="api-fill" fill="#EFEEF6" data-stroke-role="api-line" stroke="#5B54A8" stroke-width="1.2"/>
  <text x="592" y="104" font-size="12.5" font-weight="700" data-fill-role="api-ink" fill="#322E5C" text-anchor="middle" dominant-baseline="central">모델</text>
  <text x="592" y="126" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">답변·도구 호출 제안</text>

  <path d="M152 113 L202 113" fill="none" data-stroke-role="edge-line" stroke="#2E6DA4" stroke-width="2" marker-end="url(#arrow-edge)"/>
  <path d="M214 146 C194 160 174 160 152 140" fill="none" data-stroke-role="warning-line" stroke="#B08434" stroke-width="1.8" marker-end="url(#arrow-warning)"/>
  <text x="182" y="174" font-size="9.5" data-fill-role="warning-ink" fill="#5E4416" text-anchor="middle" dominant-baseline="central">승인 요청</text>
  <path d="M466 112 L516 112" fill="none" data-stroke-role="edge-line" stroke="#2E6DA4" stroke-width="2" marker-end="url(#arrow-edge)"/>
  <path d="M528 134 C500 158 494 190 466 194" fill="none" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="2" marker-end="url(#arrow-compute)"/>

  <rect x="24" y="278" width="144" height="74" rx="12" data-fill-role="compute-fill" fill="#ECF4F1" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1.1"/>
  <text x="96" y="300" font-size="12" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="middle" dominant-baseline="central">Agent Skills</text>
  <text x="96" y="324" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">작업 절차와 출력 형식</text>

  <rect x="184" y="278" width="144" height="74" rx="12" data-fill-role="compute-fill" fill="#ECF4F1" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1.1"/>
  <text x="256" y="300" font-size="12" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="middle" dominant-baseline="central">Tools · MCP</text>
  <text x="256" y="324" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">실제 행동과 데이터 접근</text>

  <rect x="344" y="278" width="144" height="74" rx="12" data-fill-role="api-fill" fill="#EFEEF6" data-stroke-role="api-line" stroke="#5B54A8" stroke-width="1.1"/>
  <text x="416" y="300" font-size="12" font-weight="700" data-fill-role="api-ink" fill="#322E5C" text-anchor="middle" dominant-baseline="central">Context</text>
  <text x="416" y="324" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">모델에 넣을 정보</text>

  <rect x="504" y="278" width="152" height="74" rx="12" data-fill-role="warning-fill" fill="#FBF4E6" data-stroke-role="warning-line" stroke="#B08434" stroke-width="1.1"/>
  <text x="580" y="300" font-size="12" font-weight="700" data-fill-role="warning-ink" fill="#5E4416" text-anchor="middle" dominant-baseline="central">Harness</text>
  <text x="580" y="324" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">런타임 정책 · 검증 기준</text>

  <path d="M96 278 L96 260 L260 260 L260 250" fill="none" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1.8" marker-end="url(#arrow-compute)"/>
  <path d="M256 278 L256 268 L300 268 L300 250" fill="none" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1.8" marker-end="url(#arrow-compute)"/>
  <path d="M416 278 L416 268 L380 268 L380 250" fill="none" data-stroke-role="api-line" stroke="#5B54A8" stroke-width="1.8" marker-end="url(#arrow-api)"/>
  <path d="M580 278 L580 260 L420 260 L420 250" fill="none" data-stroke-role="warning-line" stroke="#B08434" stroke-width="1.8" marker-end="url(#arrow-warning)"/>
  <text x="340" y="374" font-size="11" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">신뢰 경계는 모델의 말이 아니라 runtime·도구·권한 설정에 둔다</text>
</svg>
