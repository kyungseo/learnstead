  <text x="228" y="89" font-size="11.5" font-weight="700" data-fill-role="edge-ink" fill="#193C5A" text-anchor="start" dominant-baseline="central">진입 지시문 (항상)</text>
  <text x="228" y="105" font-size="10" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">Claude 11 · Codex 15</text>
