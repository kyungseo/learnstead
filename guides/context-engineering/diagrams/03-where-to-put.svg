<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352" width="680" height="352" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>어디에 둘 것인가 — 결정 순서</title>
  <desc>지시를 어디에 둘지 고르는 결정 순서. 모든 작업에 필요하고 짧으면 진입 지시문, 특정 파일 종류면 Claude Code는 경로 규칙·Codex는 skill, 특정 작업 절차면 skill, 길지만 항상 필요하면 import, 참고 자료면 pointer에 읽을 시점을 문장으로. 실측 점수를 각 칸에 적었다.</desc>
  <defs><marker id="ah-data-line-1.5" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="6.75" markerHeight="6.75" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 2 L10 6 L2 10" fill="none" data-stroke-role="data-line" stroke="#636A75" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect x="0" y="0" width="680" height="352" data-fill-role="surface" fill="#FFFFFF"/>
  <rect x="24" y="13" width="3" height="22" rx="1.5" data-fill-role="focus" fill="#2E6DA4" />
  <text x="36" y="24" font-size="18" font-weight="700" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">짧은 진입 지시문 + 필요한 곳에 조건부</text>
  <text x="36" y="46" font-size="11.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">pointer는 조건부 로드가 아니다 — 도구의 기제를 쓴다</text>
