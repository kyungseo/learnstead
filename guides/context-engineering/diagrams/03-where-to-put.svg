  <text x="228" y="141" font-size="11.5" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="start" dominant-baseline="central">Claude: 경로 규칙 paths / Codex: skill</text>
  <text x="228" y="157" font-size="10" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">Claude 13 · (Codex 중첩 AGENTS.md는 cwd 조건, 6)</text>
  <rect x="24" y="178" width="160" height="42" rx="10" data-fill-role="data-fill" fill="#F4F5F5" data-stroke-role="data-line" stroke="#636A75" stroke-width="1" />
  <text x="104" y="199.0" font-size="11.5" font-weight="700" data-fill-role="data-ink" fill="#363A40" text-anchor="middle" dominant-baseline="central">특정 작업 절차</text>
