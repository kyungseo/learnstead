  <text x="228" y="297" font-size="11.5" font-weight="700" data-fill-role="warning-ink" fill="#5E4416" text-anchor="start" dominant-baseline="central">pointer + &quot;언제 읽으라&quot;는 문장</text>
  <text x="228" y="313" font-size="10" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">Claude 9 · Codex 14 — 판단에 맡김</text>
  <text x="340.0" y="338" font-size="11" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">점수는 실습 라운드 2 (규칙 5개 × 3회 = 15점) · 준수율이 낮으면 길이보다 규칙 문장의 모호함을 먼저 의심한다</text>
