  <rect x="24" y="282" width="160" height="42" rx="10" data-fill-role="data-fill" fill="#F4F5F5" data-stroke-role="data-line" stroke="#636A75" stroke-width="1" />
  <text x="104" y="303.0" font-size="11.5" font-weight="700" data-fill-role="data-ink" fill="#363A40" text-anchor="middle" dominant-baseline="central">참고 자료</text>
