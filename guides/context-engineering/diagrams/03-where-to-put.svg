  <text x="228" y="209" font-size="10" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">agent-skills 실습 3/3</text>
  <rect x="24" y="230" width="160" height="42" rx="10" data-fill-role="data-fill" fill="#F4F5F5" data-stroke-role="data-line" stroke="#636A75" stroke-width="1" />
