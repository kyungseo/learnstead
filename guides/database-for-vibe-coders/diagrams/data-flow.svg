<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" font-family="Pretendard, Inter, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" role="img" aria-labelledby="title desc"><title id="title">화면 뒤의 저장 경로를 확인한다</title><desc id="desc">사용자 입력은 접근 규칙을 거쳐 저장소에 도달합니다.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9.9" markerHeight="9.9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#2E6DA4" data-stroke-role="edge-line" stroke-width="2" stroke-linecap="round"/></marker></defs><rect width="680" height="540" fill="#F7F7F5" data-fill-role="canvas"/><text x="32" y="38" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#636A75" data-fill-role="muted">LEARNSTEAD · DATABASE</text><text x="32" y="70" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central" fill="#252B35" data-fill-role="ink">화면 뒤의 저장 경로를 확인한다</text><text x="32" y="100" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#636A75" data-fill-role="muted">사용자 입력은 접근 규칙을 거쳐 저장소에 도달합니다.</text><rect x="32" y="154" width="168" height="178" rx="16" fill="#FFFFFF" data-fill-role="surface" stroke="#DEE0E2" data-stroke-role="rule" stroke-width="1"/><circle cx="116" cy="198" r="27" fill="#EAF0F6" data-fill-role="icon-tint"/><path d="M8 11 A3 3 0 1 0 8 5 A3 3 0 1 0 8 11 M2 20 A6 6 0 0 1 14 20 M16 6 A3 3 0 0 1 16 11 M15 20 A6 6 0 0 0 22 20" transform="translate(100 182) scale(1.333333)" fill="none" stroke="#2E6DA4" data-stroke-role="edge-line" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="116" y="246" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#252B35" data-fill-role="ink">화면</text><text x="116" y="279" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#636A75" data-fill-role="muted">입력하고 결과 확인</text><text x="116" y="303" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#636A75" data-fill-role="muted">비밀키를 두지 않음</text><path d="M209 242 L246 242" fill="none" stroke="#2E6DA4" data-stroke-role="edge-line" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="256" y="154" width="168" height="178" rx="16" fill="#FFFFFF" data-fill-role="surface" stroke="#DEE0E2" data-stroke-role="rule" stroke-width="1"/><circle cx="340" cy="198" r="27" fill="#EAF0F6" data-fill-role="icon-tint"/><path d="M12 3 L20 6 V12 C20 17 16 20 12 21 C8 20 4 17 4 12 V6 Z" transform="translate(324 182) scale(1.333333)" fill="none" stroke="#2E6DA4" data-stroke-role="edge-line" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="340" y="246" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#252B35" data-fill-role="ink">API · 권한</text><text x="340" y="279" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#636A75" data-fill-role="muted">요청자와 허용 범위</text><text x="340" y="303" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#636A75" data-fill-role="muted">서버에서 확인</text><path d="M433 242 L470 242" fill="none" stroke="#2E6DA4" data-stroke-role="edge-line" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="480" y="154" width="168" height="178" rx="16" fill="#FFFFFF" data-fill-role="surface" stroke="#DEE0E2" data-stroke-role="rule" stroke-width="1"/><circle cx="564" cy="198" r="27" fill="#EAF0F6" data-fill-role="icon-tint"/><path d="M4 6 A8 3 0 1 0 20 6 A8 3 0 1 0 4 6 M4 6 V18 A8 3 0 0 0 20 18 V6" transform="translate(548 182) scale(1.333333)" fill="none" stroke="#2E6DA4" data-stroke-role="edge-line" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="564" y="246" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#252B35" data-fill-role="ink">데이터베이스</text><text x="564" y="279" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#636A75" data-fill-role="muted">관계와 제약조건</text><text x="564" y="303" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#636A75" data-fill-role="muted">데이터를 유지</text><text x="32" y="368" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="central" fill="#252B35" data-fill-role="ink">브라우저 저장소는 별도 경로</text><text x="32" y="395" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#636A75" data-fill-role="muted">같은 화면이라도 저장 위치가 다르면 공유·복구 방법도 달라집니다.</text><text x="32" y="438" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="central" fill="#252B35" data-fill-role="ink">이번 예제: Supabase</text><text x="32" y="465" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#636A75" data-fill-role="muted">브라우저 요청 → API와 RLS → PostgreSQL 순서로 확인합니다.</text></svg>