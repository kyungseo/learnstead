<svg xmlns="http://www.w3.org/2000/svg" width="680" height="530" viewBox="0 0 680 530" font-family="Pretendard, Inter, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" role="img" aria-labelledby="title desc"><title id="title">신청 내역으로 사람과 모임을 연결한다</title><desc id="desc">화살표는 신청 내역이 참조하는 대상을 가리킵니다.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9.9" markerHeight="9.9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#2E6DA4" data-stroke-role="edge-line" stroke-width="2" stroke-linecap="round"/></marker></defs><rect width="680" height="530" fill="#F7F7F5" data-fill-role="canvas"/><text x="32" y="38" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#636A75" data-fill-role="muted">LEARNSTEAD · DATABASE</text><text x="32" y="70" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central" fill="#252B35" data-fill-role="ink">신청 내역으로 사람과 모임을 연결한다</text><text x="32" y="100" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#636A75" data-fill-role="muted">화살표는 신청 내역이 참조하는 대상을 가리킵니다.</text><rect x="32" y="164" width="168" height="210" rx="16" fill="#FFFFFF" data-fill-role="surface" stroke="#DEE0E2" data-stroke-role="rule" stroke-width="1"/><text x="116" y="194" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#252B35" data-fill-role="ink">사용자</text><text x="116" y="242" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#636A75" data-fill-role="muted">id</text><text x="116" y="277" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#636A75" data-fill-role="muted">인증 서비스에서 관리</text><rect x="256" y="164" width="168" height="210" rx="16" fill="#FFFFFF" data-fill-role="surface" stroke="#DEE0E2" data-stroke-role="rule" stroke-width="1"/><text x="340" y="194" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#252B35" data-fill-role="ink">신청 내역</text><text x="340" y="242" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#636A75" data-fill-role="muted">user_id → 사용자</text><text x="340" y="277" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#636A75" data-fill-role="muted">event_id → 모임</text><text x="340" y="312" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#636A75" data-fill-role="muted">같은 조합은 한 번만</text><rect x="480" y="164" width="168" height="210" rx="16" fill="#FFFFFF" data-fill-role="surface" stroke="#DEE0E2" data-stroke-role="rule" stroke-width="1"/><text x="564" y="194" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#252B35" data-fill-role="ink">모임</text><text x="564" y="242" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#636A75" data-fill-role="muted">id · 제목</text><text x="564" y="277" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#636A75" data-fill-role="muted">정원</text><path d="M246 225 L210 225" fill="none" stroke="#2E6DA4" data-stroke-role="edge-line" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M434 225 L470 225" fill="none" stroke="#2E6DA4" data-stroke-role="edge-line" stroke-width="2.2" marker-end="url(#arrow)"/><text x="32" y="418" font-size="20" font-weight="700" text-anchor="start" dominant-baseline="central" fill="#252B35" data-fill-role="ink">ID로 연결하고, DB에 규칙을 둡니다.</text><text x="32" y="452" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#636A75" data-fill-role="muted">신청 내역의 두 ID는 실제 사용자와 모임을 가리켜야 합니다.</text><text x="32" y="480" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#636A75" data-fill-role="muted">한 사람이 여러 모임에, 한 모임에 여러 사람이 신청할 수 있습니다.</text></svg>