<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" font-family="Pretendard, Inter, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" role="img" aria-labelledby="title desc"><title id="title">되돌릴 대상마다 복구 방법이 다르다</title><desc id="desc">코드, DB, 첨부 파일의 복구 범위를 각각 확인합니다.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9.9" markerHeight="9.9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#2E6DA4" data-stroke-role="edge-line" stroke-width="2" stroke-linecap="round"/></marker></defs><rect width="680" height="540" fill="#F7F7F5" data-fill-role="canvas"/><text x="32" y="38" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#636A75" data-fill-role="muted">LEARNSTEAD · DATABASE</text><text x="32" y="70" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central" fill="#252B35" data-fill-role="ink">되돌릴 대상마다 복구 방법이 다르다</text><text x="32" y="100" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#636A75" data-fill-role="muted">코드, DB, 첨부 파일의 복구 범위를 각각 확인합니다.</text><rect x="32" y="154" width="168" height="178" rx="16" fill="#FFFFFF" data-fill-role="surface" stroke="#DEE0E2" data-stroke-role="rule" stroke-width="1"/><circle cx="116" cy="198" r="27" fill="#EAF0F6" data-fill-role="icon-tint"/><path d="M6 3 H14 L18 7 V21 H6 Z M14 3 V7 H18 M9 13 H15 M9 16.5 H15 M9 9.5 H11" transform="translate(100 182) scale(1.333333)" fill="none" stroke="#2E6DA4" data-stroke-role="edge-line" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="116" y="246" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#252B35" data-fill-role="ink">코드</text><text x="116" y="279" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#636A75" data-fill-role="muted">Git의 저장 지점</text><text x="116" y="303" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#636A75" data-fill-role="muted">앱 코드와 변경 이력</text><rect x="256" y="154" width="168" height="178" rx="16" fill="#FFFFFF" data-fill-role="surface" stroke="#DEE0E2" data-stroke-role="rule" stroke-width="1"/><circle cx="340" cy="198" r="27" fill="#EAF0F6" data-fill-role="icon-tint"/><path d="M4 6 A8 3 0 1 0 20 6 A8 3 0 1 0 4 6 M4 6 V18 A8 3 0 0 0 20 18 V6" transform="translate(324 182) scale(1.333333)" fill="none" stroke="#2E6DA4" data-stroke-role="edge-line" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="340" y="246" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#252B35" data-fill-role="ink">데이터베이스</text><text x="340" y="279" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#636A75" data-fill-role="muted">백업과 복원</text><text x="340" y="303" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#636A75" data-fill-role="muted">행·구조·권한 확인</text><rect x="480" y="154" width="168" height="178" rx="16" fill="#FFFFFF" data-fill-role="surface" stroke="#DEE0E2" data-stroke-role="rule" stroke-width="1"/><circle cx="564" cy="198" r="27" fill="#EAF0F6" data-fill-role="icon-tint"/><path d="M6 17 A4 4 0 1 1 8 9 A5 5 0 0 1 18 10 A4 4 0 1 1 18 17 Z" transform="translate(548 182) scale(1.333333)" fill="none" stroke="#2E6DA4" data-stroke-role="edge-line" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="564" y="246" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#252B35" data-fill-role="ink">첨부 파일</text><text x="564" y="279" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#636A75" data-fill-role="muted">파일 저장소 백업</text><text x="564" y="303" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#636A75" data-fill-role="muted">DB 메타데이터와 대조</text><text x="32" y="368" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="central" fill="#252B35" data-fill-role="ink">세 상자는 별도의 복구 대상입니다.</text><text x="32" y="395" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#636A75" data-fill-role="muted">왼쪽에서 오른쪽으로 자동 복원된다는 뜻이 아닙니다.</text><text x="32" y="438" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="central" fill="#252B35" data-fill-role="ink">복원 후 다시 확인</text><text x="32" y="465" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#636A75" data-fill-role="muted">별도 대상에 복원한 뒤 데이터와 앱 동작이 맞는지 확인합니다.</text></svg>