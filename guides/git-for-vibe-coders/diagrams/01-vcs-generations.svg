<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>버전 관리 도구의 세 세대</title>
  <desc>CVS는 파일별 기록의 초기 형태, SVN은 중앙 서버 하나가 전체 기록을 소유하고 사용자는 작업본만 가지며, Git은 모든 사용자가 전체 기록의 복사본을 갖는 분산형이다.</desc>
  <defs><marker id="ah-data-line-2" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9.0" markerHeight="9.0" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 2 L10 6 L2 10" fill="none" data-stroke-role="data-line" stroke="#636A75" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect x="0" y="0" width="680" height="330" data-fill-role="surface" fill="#FFFFFF"/>
  <rect x="24" y="13" width="3" height="22" rx="1.5" data-fill-role="focus" fill="#2E6DA4" />
  <text x="36" y="24" font-size="18" font-weight="700" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">기록을 어디에 두는가 — 세 세대의 차이</text>
  <text x="36" y="46" font-size="11.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">Git의 특징 한 줄: 나도 기록 전체를 가진다 → 인터넷 없이도 커밋·되돌리기·브랜치</text>
  <rect x="24" y="74" width="200" height="42" rx="9" data-fill-role="data-fill" fill="#F4F5F5" data-stroke-role="data-line" stroke="#636A75" stroke-width="1" />
  <text x="124.0" y="86.75" font-size="15" font-weight="700" data-fill-role="data-ink" fill="#363A40" text-anchor="middle" dominant-baseline="central">CVS</text>
  <text x="124.0" y="101.25" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">1세대 · 1990년경</text>
  <rect x="24" y="132" width="200" height="26" rx="6" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="data-line" stroke="#636A75" stroke-width="1" />
  <text x="36" y="145" font-size="10.5" data-fill-role="data-ink" fill="#363A40" text-anchor="start" dominant-baseline="central">파일 하나씩 기록</text>
  <rect x="24" y="162" width="200" height="26" rx="6" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="data-line" stroke="#636A75" stroke-width="1" />
  <text x="36" y="175" font-size="10.5" data-fill-role="data-ink" fill="#363A40" text-anchor="start" dominant-baseline="central">초기 중앙 방식</text>
  <rect x="24" y="192" width="200" height="26" rx="6" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="data-line" stroke="#636A75" stroke-width="1" />
  <text x="36" y="205" font-size="10.5" data-fill-role="data-ink" fill="#363A40" text-anchor="start" dominant-baseline="central">브랜치가 무겁다</text>
  <rect x="240" y="74" width="200" height="42" rx="9" data-fill-role="edge-fill" fill="#EAF0F6" data-stroke-role="edge-line" stroke="#2E6DA4" stroke-width="1" />
  <text x="340.0" y="86.75" font-size="15" font-weight="700" data-fill-role="edge-ink" fill="#193C5A" text-anchor="middle" dominant-baseline="central">SVN</text>
  <text x="340.0" y="101.25" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">2세대 · 2000년경</text>
  <rect x="240" y="132" width="200" height="26" rx="6" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="edge-line" stroke="#2E6DA4" stroke-width="1" />
  <text x="252" y="145" font-size="10.5" data-fill-role="edge-ink" fill="#193C5A" text-anchor="start" dominant-baseline="central">중앙 서버가 기록 소유</text>
  <rect x="240" y="162" width="200" height="26" rx="6" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="edge-line" stroke="#2E6DA4" stroke-width="1" />
  <text x="252" y="175" font-size="10.5" data-fill-role="edge-ink" fill="#193C5A" text-anchor="start" dominant-baseline="central">사용자는 작업본만</text>
  <rect x="240" y="192" width="200" height="26" rx="6" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="edge-line" stroke="#2E6DA4" stroke-width="1" />
  <text x="252" y="205" font-size="10.5" data-fill-role="edge-ink" fill="#193C5A" text-anchor="start" dominant-baseline="central">서버 없으면 커밋 불가</text>
  <rect x="456" y="74" width="200" height="42" rx="9" data-fill-role="compute-fill" fill="#ECF4F1" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="556.0" y="86.75" font-size="15" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="middle" dominant-baseline="central">Git</text>
  <text x="556.0" y="101.25" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">3세대 · 2005년</text>
  <rect x="456" y="132" width="200" height="26" rx="6" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="468" y="145" font-size="10.5" data-fill-role="compute-ink" fill="#234F3F" text-anchor="start" dominant-baseline="central">모두가 전체 기록 보유</text>
  <rect x="456" y="162" width="200" height="26" rx="6" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="468" y="175" font-size="10.5" data-fill-role="compute-ink" fill="#234F3F" text-anchor="start" dominant-baseline="central">오프라인에서도 전부 동작</text>
  <rect x="456" y="192" width="200" height="26" rx="6" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="468" y="205" font-size="10.5" data-fill-role="compute-ink" fill="#234F3F" text-anchor="start" dominant-baseline="central">브랜치가 가볍다</text>
  <path d="M228 95 L236 95" fill="none" data-stroke-role="data-line" stroke="#636A75" stroke-width="2" marker-end="url(#ah-data-line-2)"/>
  <path d="M444 95 L452 95" fill="none" data-stroke-role="data-line" stroke="#636A75" stroke-width="2" marker-end="url(#ah-data-line-2)"/>
  <rect x="24" y="232" width="632" height="66" rx="12" data-fill-role="api-fill" fill="#EFEEF6" data-stroke-role="api-line" stroke="#5B54A8" stroke-width="1" />
  <text x="40" y="250" font-size="11" font-weight="700" data-fill-role="api-ink" fill="#322E5C" text-anchor="start" dominant-baseline="central">기록이 있는 곳</text>
  <text x="124" y="276" font-size="11" font-weight="700" data-fill-role="ink" fill="#252B35" text-anchor="middle" dominant-baseline="central">서버(초기)</text>
  <text x="340" y="276" font-size="11" font-weight="700" data-fill-role="ink" fill="#252B35" text-anchor="middle" dominant-baseline="central">중앙 서버 1곳</text>
  <text x="556" y="276" font-size="11" font-weight="700" data-fill-role="ink" fill="#252B35" text-anchor="middle" dominant-baseline="central">내 컴퓨터 + 원격 모두</text>
  <text x="340.0" y="314" font-size="11" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">지금 새로 배울 것은 Git 하나 — 앞 세대는 &#x27;Git이 왜 이렇게 생겼나&#x27;의 배경</text>
</svg>
