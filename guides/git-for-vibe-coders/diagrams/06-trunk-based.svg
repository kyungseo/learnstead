<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>트렁크 기반과 GitFlow 비교</title>
  <desc>두 모델 모두 시간과 작업이 왼쪽에서 오른쪽으로 진행한다. 트렁크 기반은 main에서 짧은 작업 브랜치가 갈라졌다 곧 main으로 합쳐진다. GitFlow는 main과 develop을 오래 유지하며 feature, release, hotfix가 정해진 기준 브랜치에서 갈라지고 다시 합쳐진다.</desc>
  <rect x="0" y="0" width="680" height="340" data-fill-role="surface" fill="#FFFFFF"/>
  <rect x="24" y="13" width="3" height="22" rx="1.5" data-fill-role="focus" fill="#2E6DA4"/>
  <text x="36" y="24" font-size="18" font-weight="700" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">처음에는 main + 짧은 작업 브랜치로 시작한다</text>
  <text x="36" y="46" font-size="11.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">시간과 작업은 왼쪽에서 오른쪽으로 진행</text>

  <rect x="24" y="70" width="304" height="220" rx="12" data-fill-role="compute-fill" fill="#ECF4F1" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1"/>
  <text x="40" y="88" font-size="13" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="start" dominant-baseline="central">트렁크 기반 (권장)</text>
  <text x="300" y="108" font-size="9.5" data-fill-role="muted" fill="#636A75" text-anchor="end" dominant-baseline="central">작업 진행 →</text>
  <text x="72" y="154" font-size="10.5" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="end" dominant-baseline="central">main</text>
  <path d="M80 154 L294 154" fill="none" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="3"/>
  <circle cx="108" cy="154" r="5" data-fill-role="compute-line" fill="#3F8F72"/>
  <circle cx="170" cy="154" r="5" data-fill-role="compute-line" fill="#3F8F72"/>
  <circle cx="200" cy="154" r="5" data-fill-role="compute-line" fill="#3F8F72"/>
  <circle cx="262" cy="154" r="5" data-fill-role="compute-line" fill="#3F8F72"/>
  <path d="M108 154 C116 134 124 126 140 126 C154 126 162 134 170 154" fill="none" data-stroke-role="edge-line" stroke="#2E6DA4" stroke-width="2"/>
  <circle cx="140" cy="126" r="5" data-fill-role="edge-line" fill="#2E6DA4"/>
  <path d="M200 154 C208 134 216 126 232 126 C246 126 254 134 262 154" fill="none" data-stroke-role="edge-line" stroke="#2E6DA4" stroke-width="2"/>
  <circle cx="232" cy="126" r="5" data-fill-role="edge-line" fill="#2E6DA4"/>
  <text x="186" y="112" font-size="9.5" data-fill-role="edge-ink" fill="#193C5A" text-anchor="middle" dominant-baseline="central">짧은 작업 브랜치</text>
  <text x="48" y="194" font-size="10.5" data-fill-role="compute-ink" fill="#234F3F" text-anchor="start" dominant-baseline="central">1. main은 항상 돌아가는 상태</text>
  <text x="48" y="216" font-size="10.5" data-fill-role="compute-ink" fill="#234F3F" text-anchor="start" dominant-baseline="central">2. 작업은 짧은 브랜치에서</text>
  <text x="48" y="238" font-size="10.5" data-fill-role="compute-ink" fill="#234F3F" text-anchor="start" dominant-baseline="central">3. 며칠 안에 합치고 지운다</text>
  <text x="48" y="260" font-size="10.5" data-fill-role="compute-ink" fill="#234F3F" text-anchor="start" dominant-baseline="central">4. 한 브랜치 = 한 가지 일</text>

  <rect x="352" y="70" width="304" height="220" rx="12" data-fill-role="data-fill" fill="#F4F5F5" data-stroke-role="data-line" stroke="#636A75" stroke-width="1"/>
  <text x="368" y="88" font-size="13" font-weight="700" data-fill-role="data-ink" fill="#363A40" text-anchor="start" dominant-baseline="central">GitFlow (역할별 브랜치)</text>
  <text x="628" y="108" font-size="9.5" data-fill-role="muted" fill="#636A75" text-anchor="end" dominant-baseline="central">작업 진행 →</text>
  <text x="420" y="130" font-size="9.5" data-fill-role="muted" fill="#636A75" text-anchor="end" dominant-baseline="central">main</text>
  <path d="M430 130 L624 130" fill="none" data-stroke-role="data-line" stroke="#636A75" stroke-width="2.5"/>
  <text x="420" y="174" font-size="9.5" data-fill-role="muted" fill="#636A75" text-anchor="end" dominant-baseline="central">develop</text>
  <path d="M430 174 L624 174" fill="none" data-stroke-role="api-line" stroke="#5B54A8" stroke-width="2.5"/>
  <circle cx="458" cy="130" r="5" data-fill-role="data-line" fill="#636A75"/>
  <circle cx="534" cy="130" r="5" data-fill-role="data-line" fill="#636A75"/>
  <circle cx="608" cy="130" r="5" data-fill-role="data-line" fill="#636A75"/>
  <circle cx="458" cy="174" r="5" data-fill-role="api-line" fill="#5B54A8"/>
  <circle cx="536" cy="174" r="5" data-fill-role="api-line" fill="#5B54A8"/>
  <circle cx="600" cy="174" r="5" data-fill-role="api-line" fill="#5B54A8"/>
  <path d="M458 130 C468 112 478 108 492 108 C510 108 522 116 534 130" fill="none" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="2"/>
  <circle cx="492" cy="108" r="5" data-fill-role="danger-line" fill="#B45A50"/>
  <text x="454" y="108" font-size="9" data-fill-role="danger-ink" fill="#6E2F28" text-anchor="end" dominant-baseline="central">hotfix</text>
  <path d="M458 174 C470 196 482 206 498 206 C516 206 526 194 536 174" fill="none" data-stroke-role="edge-line" stroke="#2E6DA4" stroke-width="2"/>
  <circle cx="498" cy="206" r="5" data-fill-role="edge-line" fill="#2E6DA4"/>
  <text x="498" y="222" font-size="9" data-fill-role="edge-ink" fill="#193C5A" text-anchor="middle" dominant-baseline="central">feature</text>
  <path d="M536 174 C546 154 556 148 570 148 C588 148 598 140 608 130" fill="none" data-stroke-role="warning-line" stroke="#B08434" stroke-width="2"/>
  <circle cx="570" cy="148" r="5" data-fill-role="warning-line" fill="#B08434"/>
  <text x="570" y="162" font-size="9" data-fill-role="warning-ink" fill="#6A4C16" text-anchor="middle" dominant-baseline="central">release</text>
  <text x="504" y="250" font-size="10.5" data-fill-role="data-ink" fill="#363A40" text-anchor="middle" dominant-baseline="central">main·develop을 오래 유지</text>
  <text x="504" y="270" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">feature·release·hotfix마다 분기·병합 규칙</text>

  <text x="340" y="322" font-size="11" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">선이 갈라지고 다시 만나는 모양으로 branch와 merge를 읽는다</text>
</svg>
