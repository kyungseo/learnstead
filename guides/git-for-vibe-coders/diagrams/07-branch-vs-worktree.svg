<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">branch와 worktree의 책상 비유</title>
  <desc id="desc">branch만 사용할 때는 하나의 책상에서 펼친 작업을 바꾸고, worktree를 사용하면 공용 저장소 기록을 공유하는 책상을 여러 개 두어 서로 다른 branch를 동시에 펼쳐 놓는다.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 L11 7 L2 12" fill="none" stroke="#2E6DA4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1440" height="900" fill="#F7F7F5" data-fill-role="canvas"/>
  <text x="72" y="84" fill="#252B35" data-fill-role="ink" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="42" font-weight="700">branch는 작업의 갈래, worktree는 갈래를 펼친 별도 폴더</text>
  <text x="72" y="128" fill="#636A75" data-fill-role="muted" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="24">공용 기록은 하나지만, 작업 폴더는 필요에 따라 여러 개 둘 수 있다.</text>

  <g font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
    <rect x="72" y="190" width="610" height="610" rx="34" fill="#FFFFFF" stroke="#DEE0E2" stroke-width="3" data-fill-role="surface" data-stroke-role="rule"/>
    <text x="112" y="248" fill="#252B35" data-fill-role="ink" font-size="32" font-weight="700">branch만 사용</text>
    <text x="112" y="286" fill="#636A75" data-fill-role="muted" font-size="22">책상 하나에서 펼친 작업을 바꾼다</text>

    <rect x="210" y="360" width="330" height="220" rx="28" fill="#E4EDF3" stroke="#2E6DA4" stroke-width="3" data-fill-role="surface-tint" data-stroke-role="focus"/>
    <text x="375" y="405" text-anchor="middle" fill="#252B35" data-fill-role="ink" font-size="28" font-weight="700">working tree 1개</text>
    <rect x="260" y="446" width="230" height="78" rx="18" fill="#FFFFFF" stroke="#2E6DA4" stroke-width="2" data-fill-role="surface" data-stroke-role="focus"/>
    <text x="375" y="495" text-anchor="middle" fill="#2E6DA4" data-fill-role="focus" font-size="27" font-weight="700">main</text>
    <path d="M260 620 H490" fill="none" stroke="#2E6DA4" stroke-width="3" marker-end="url(#arrow)" data-stroke-role="focus"/>
    <text x="375" y="662" text-anchor="middle" fill="#636A75" data-fill-role="muted" font-size="23">git switch</text>
    <rect x="260" y="692" width="230" height="64" rx="18" fill="#F7EFDF" stroke="#B08434" stroke-width="2" data-fill-role="surface-tint" data-stroke-role="warning"/>
    <text x="375" y="733" text-anchor="middle" fill="#8A6725" data-fill-role="warning" font-size="25" font-weight="700">add-login</text>

    <rect x="758" y="190" width="610" height="610" rx="34" fill="#FFFFFF" stroke="#DEE0E2" stroke-width="3" data-fill-role="surface" data-stroke-role="rule"/>
    <text x="798" y="248" fill="#252B35" data-fill-role="ink" font-size="32" font-weight="700">worktree 추가</text>
    <text x="798" y="286" fill="#636A75" data-fill-role="muted" font-size="22">책상을 늘려 서로 다른 branch를 동시에 펼친다</text>

    <rect x="832" y="354" width="210" height="240" rx="26" fill="#E4EDF3" stroke="#2E6DA4" stroke-width="3" data-fill-role="surface-tint" data-stroke-role="focus"/>
    <text x="937" y="401" text-anchor="middle" fill="#252B35" data-fill-role="ink" font-size="25" font-weight="700">원래 폴더</text>
    <rect x="862" y="455" width="150" height="74" rx="18" fill="#FFFFFF" stroke="#2E6DA4" stroke-width="2" data-fill-role="surface" data-stroke-role="focus"/>
    <text x="937" y="501" text-anchor="middle" fill="#2E6DA4" data-fill-role="focus" font-size="25" font-weight="700">main</text>

    <rect x="1084" y="354" width="210" height="240" rx="26" fill="#F7EFDF" stroke="#B08434" stroke-width="3" data-fill-role="surface-tint" data-stroke-role="warning"/>
    <text x="1189" y="401" text-anchor="middle" fill="#252B35" data-fill-role="ink" font-size="25" font-weight="700">추가 폴더</text>
    <rect x="1114" y="455" width="150" height="74" rx="18" fill="#FFFFFF" stroke="#B08434" stroke-width="2" data-fill-role="surface" data-stroke-role="warning"/>
    <text x="1189" y="501" text-anchor="middle" fill="#8A6725" data-fill-role="warning" font-size="25" font-weight="700">add-login</text>

    <rect x="870" y="664" width="386" height="76" rx="22" fill="#E5F1EC" stroke="#3F8F72" stroke-width="2" data-fill-role="surface-tint" data-stroke-role="positive"/>
    <text x="1063" y="695" text-anchor="middle" fill="#2E6756" data-fill-role="positive" font-size="22" font-weight="650">공유: commit · branch · remote</text>
    <text x="1063" y="724" text-anchor="middle" fill="#636A75" data-fill-role="muted" font-size="19">분리: 파일 · HEAD · staging</text>
  </g>
</svg>
