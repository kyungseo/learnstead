<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>비밀값이 어디까지 갔는가 — 네 단계</title>
  <desc>Secret 파일이 작업 폴더에만 있으면 gitignore에 추가하고, staging에 담겼으면 restore --staged로 빼며, commit됐지만 push 전이면 rm --cached와 amend로 처리할 수 있다. push된 뒤에는 먼저 기존 키를 폐기하고 새 키를 발급해야 하며, 기록 삭제만으로 사고 대응을 끝낼 수 없다.</desc>
  <defs><marker id="ah-data-line-2" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9.0" markerHeight="9.0" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 2 L10 6 L2 10" fill="none" data-stroke-role="data-line" stroke="#636A75" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect x="0" y="0" width="680" height="300" data-fill-role="surface" fill="#FFFFFF"/>
  <rect x="24" y="13" width="3" height="22" rx="1.5" data-fill-role="focus" fill="#2E6DA4" />
  <text x="36" y="24" font-size="18" font-weight="700" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">push 전과 후는 완전히 다른 문제다</text>
  <text x="36" y="46" font-size="11.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">외부에 push한 비밀값은 노출됐을 가능성이 있다고 본다</text>
  <rect x="24" y="78" width="146" height="116" rx="10" data-fill-role="compute-fill" fill="#ECF4F1" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="97" y="100" font-size="12" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="middle" dominant-baseline="central">① 작업 폴더에만</text>
  <text x="97" y="126" font-size="12" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="middle" dominant-baseline="central">😀 문제 없음</text>
  <line x1="40" y1="144" x2="154" y2="144" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1"/>
  <text x="97" y="168.0" font-size="9.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">.gitignore에 추가</text>
  <path d="M172 136 L184 136" fill="none" data-stroke-role="data-line" stroke="#636A75" stroke-width="2" marker-end="url(#ah-data-line-2)"/>
  <rect x="186" y="78" width="146" height="116" rx="10" data-fill-role="compute-fill" fill="#ECF4F1" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="259" y="100" font-size="12" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="middle" dominant-baseline="central">② add 했음</text>
  <text x="259" y="126" font-size="12" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="middle" dominant-baseline="central">🙂 쉬움</text>
  <line x1="202" y1="144" x2="316" y2="144" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1"/>
  <text x="259" y="168.0" font-size="9.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">git restore --staged</text>
  <path d="M334 136 L346 136" fill="none" data-stroke-role="data-line" stroke="#636A75" stroke-width="2" marker-end="url(#ah-data-line-2)"/>
  <rect x="348" y="78" width="146" height="116" rx="10" data-fill-role="warning-fill" fill="#FAF3E6" data-stroke-role="warning-line" stroke="#B08434" stroke-width="1" />
  <text x="421" y="100" font-size="12" font-weight="700" data-fill-role="warning-ink" fill="#6B4F1A" text-anchor="middle" dominant-baseline="central">③ 커밋했음</text>
  <text x="421" y="126" font-size="12" font-weight="700" data-fill-role="warning-ink" fill="#6B4F1A" text-anchor="middle" dominant-baseline="central">😐 가능</text>
  <line x1="364" y1="144" x2="478" y2="144" data-stroke-role="warning-line" stroke="#B08434" stroke-width="1"/>
  <text x="421" y="161.25" font-size="9.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">rm --cached</text>
  <text x="421" y="174.75" font-size="9.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">amend</text>
  <path d="M496 136 L508 136" fill="none" data-stroke-role="data-line" stroke="#636A75" stroke-width="2" marker-end="url(#ah-data-line-2)"/>
  <rect x="510" y="78" width="146" height="116" rx="10" data-fill-role="danger-fill" fill="#F9ECEA" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="1" />
  <text x="583" y="100" font-size="12" font-weight="700" data-fill-role="danger-ink" fill="#6E2F28" text-anchor="middle" dominant-baseline="central">④ push 했음</text>
  <text x="583" y="126" font-size="12" font-weight="700" data-fill-role="danger-ink" fill="#6E2F28" text-anchor="middle" dominant-baseline="central">😱 키를 바꿔야 함</text>
  <line x1="526" y1="144" x2="640" y2="144" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="1"/>
  <text x="583" y="168.0" font-size="9.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">기존 키 폐기 · 새 키 발급</text>
  <line x1="502" y1="70" x2="502" y2="204" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="502" y="214" font-size="11" font-weight="700" data-fill-role="danger-ink" fill="#6E2F28" text-anchor="middle" dominant-baseline="central">▲ 이 선을 넘으면 기록 삭제만으로 끝나지 않는다</text>
  <rect x="24" y="232" width="632" height="44" rx="12" data-fill-role="warning-fill" fill="#FAF3E6" data-stroke-role="warning-line" stroke="#B08434" stroke-width="1" />
  <text x="340" y="254" font-size="11.5" font-weight="700" data-fill-role="warning-ink" fill="#6B4F1A" text-anchor="middle" dominant-baseline="central">예방: .gitignore 에 .env · *.key · *.pem · config/secrets.* 를 처음부터 넣는다</text>
</svg>
