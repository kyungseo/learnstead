<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>Git 명령 위험 신호등</title>
  <desc>저장소 상태만 읽는 명령은 초록, 저장소나 작업 폴더를 바꾸므로 범위와 전제를 확인할 명령은 노랑, 커밋되지 않은 작업이나 공유 기록을 지울 수 있어 멈춰야 할 명령은 빨강으로 나눈 분류표.</desc>

  <rect x="0" y="0" width="680" height="330" data-fill-role="surface" fill="#FFFFFF"/>
  <rect x="24" y="13" width="3" height="22" rx="1.5" data-fill-role="focus" fill="#2E6DA4" />
  <text x="36" y="24" font-size="18" font-weight="700" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">AI가 제안한 명령을 세 색으로 나눈다</text>
  <text x="36" y="46" font-size="11.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">빨강이 나오면 실행 전에 되묻는다</text>
  <rect x="24" y="74" width="200" height="200" rx="10" data-fill-role="compute-fill" fill="#ECF4F1" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="124" y="96" font-size="12.5" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="middle" dominant-baseline="central">🟢 상태만 읽기</text>
  <line x1="38" y1="112" x2="210" y2="112" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1"/>
  <text x="40" y="132" font-size="10.5" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">status · log · diff · show</text>
  <text x="40" y="156" font-size="10.5" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">branch --show-current</text>
  <text x="40" y="180" font-size="10.5" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">remote -v</text>
  <text x="40" y="204" font-size="10.5" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">worktree list</text>
  <text x="124" y="258" font-size="9.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">작업 폴더와 기록을 바꾸지 않음</text>
  <rect x="240" y="74" width="200" height="200" rx="10" data-fill-role="warning-fill" fill="#FAF3E6" data-stroke-role="warning-line" stroke="#B08434" stroke-width="1" />
  <text x="340" y="96" font-size="12.5" font-weight="700" data-fill-role="warning-ink" fill="#6B4F1A" text-anchor="middle" dominant-baseline="central">🟡 조건을 확인하고</text>
  <line x1="254" y1="112" x2="426" y2="112" data-stroke-role="warning-line" stroke="#B08434" stroke-width="1"/>
  <text x="256" y="132" font-size="10.5" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">add · commit · stash · switch</text>
  <text x="256" y="156" font-size="10.5" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">restore 파일 · revert</text>
  <text x="256" y="180" font-size="10.5" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">pull · push · merge</text>
  <text x="256" y="204" font-size="10.5" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">worktree add / remove</text>
  <text x="256" y="228" font-size="10.5" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">commit --amend · rebase</text>
  <text x="340" y="258" font-size="9.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">대상·범위·공유 여부를 먼저 확인</text>
  <rect x="456" y="74" width="200" height="200" rx="10" data-fill-role="danger-fill" fill="#F9ECEA" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="1" />
  <text x="556" y="96" font-size="12.5" font-weight="700" data-fill-role="danger-ink" fill="#6E2F28" text-anchor="middle" dominant-baseline="central">🔴 멈추고 되묻기</text>
  <line x1="470" y1="112" x2="642" y2="112" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="1"/>
  <text x="472" y="132" font-size="10.5" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">reset --hard</text>
  <text x="472" y="156" font-size="10.5" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">restore . · checkout -f</text>
  <text x="472" y="180" font-size="10.5" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">push --force / -f</text>
  <text x="472" y="204" font-size="10.5" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">clean -fd · branch -D</text>
  <text x="472" y="228" font-size="10.5" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">filter-repo</text>
  <text x="556" y="258" font-size="9.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">작업이나 남의 기록이 사라질 수 있음</text>
  <rect x="24" y="288" width="632" height="0" rx="12" data-fill-role="data-fill" fill="#F4F5F5" data-stroke-role="data-line" stroke="#636A75" stroke-width="1" />
  <text x="340.0" y="300" font-size="11" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">되물을 문장: &quot;그 명령을 실행하면 지금 커밋 안 된 작업이 사라지나? 안전한 대안이 있으면 알려 줘.&quot;</text>
</svg>
