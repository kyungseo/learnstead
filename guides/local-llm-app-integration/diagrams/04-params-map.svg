  <path d="M471.0 174 L471.0 138" fill="none" data-stroke-role="edge-line" stroke="#2E6DA4" stroke-width="1.5" marker-end="url(#ah-edge-line-1_5)"/>
  <text x="340.0" y="280" font-size="11" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">finish_reason: length 면 max_tokens 에 걸린 것 — 답이 &quot;짧아서&quot;가 아니라 &quot;잘려서&quot;다</text>
</svg>
