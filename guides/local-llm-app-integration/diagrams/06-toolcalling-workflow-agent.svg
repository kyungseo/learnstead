  <rect x="24" y="13" width="3" height="22" rx="1.5" data-fill-role="focus" fill="#2E6DA4" />
  <text x="36" y="24" font-size="18" font-weight="700" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">누가 제어 흐름을 쥐는가 — 코드에서 모델로</text>
  <text x="36" y="46" font-size="11.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">순서를 아는 일은 workflow로 · agent는 &quot;다음에 뭘 할지 모르는&quot; 일에만</text>
