<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>tool calling · workflow · agent</title>
  <desc>왼쪽 tool calling은 한 번의 왕복, 가운데 workflow는 내 코드가 정한 고정 순서의 단계들, 오른쪽 agent는 모델이 매 단계 다음 도구를 고르는 선택으로, 제어 흐름의 소유자가 코드에서 모델로 옮겨 가는 스펙트럼.</desc>
