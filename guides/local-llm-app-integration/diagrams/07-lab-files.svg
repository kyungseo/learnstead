<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" role="img" style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>읽기 전용 agent 실습의 파일 경계</title><desc>agent_readonly.py는 docs 디렉터리의 Markdown 문서만 읽으며 secret의 가짜 fixture는 기본 경계 밖에 있다. demo 플래그는 그 fixture 하나만 허용한다.</desc>
  <defs><marker id="ah-allow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="13.5" markerHeight="13.5" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#3F8F72" stroke-width="2" stroke-linecap="round"/></marker><marker id="ah-deny" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#B04A5A" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect width="680" height="320" fill="#fff"/><rect x="24" y="13" width="3" height="22" rx="1.5" fill="#2E6DA4"/>
  <text x="36" y="24" font-size="18" font-weight="700" fill="#252B35" dominant-baseline="central">파일 구조 자체가 권한 경계를 보여 준다</text><text x="36" y="46" font-size="11.5" fill="#636A75" dominant-baseline="central">기본 실행은 docs/*.md만 · demo 플래그는 가짜 fixture 하나만 예외</text>
  <rect x="24" y="76" width="632" height="216" rx="13" fill="#F7F8FA" stroke="#D7DAE0"/><text x="42" y="98" font-size="13" font-weight="700" fill="#252B35">labs/</text>
  <rect x="46" y="116" width="170" height="118" rx="10" fill="#EAF0F6" stroke="#2E6DA4"/><text x="62" y="142" font-size="12" font-weight="700" fill="#193C5A">agent_readonly.py</text><text x="62" y="167" font-size="10.5" fill="#636A75">도구 명세·검증·루프</text><text x="62" y="188" font-size="10.5" fill="#636A75">경로를 resolve한 뒤</text><text x="62" y="208" font-size="10.5" fill="#636A75">허용 범위를 판정</text>
  <rect x="260" y="104" width="182" height="146" rx="10" fill="#ECF4F1" stroke="#3F8F72" stroke-width="2"/><text x="276" y="128" font-size="12" font-weight="700" fill="#234F3F">docs/ · 기본 허용</text><text x="276" y="154" font-size="10.5" fill="#252B35">휴가-규정.md</text><text x="276" y="177" font-size="10.5" fill="#252B35">회의실-예약.md</text><text x="276" y="200" font-size="10.5" fill="#252B35">공지.md</text><text x="276" y="228" font-size="10" fill="#3F8F72">Markdown · 읽기 전용</text>
  <rect x="484" y="104" width="150" height="146" rx="10" fill="#FCEBEC" stroke="#B04A5A"/><text x="500" y="128" font-size="12" font-weight="700" fill="#7A2734">secret/ · 기본 거부</text><text x="500" y="157" font-size="10.5" fill="#252B35">비밀-메모.md</text><text x="500" y="181" font-size="10" fill="#636A75">실제 비밀 아님</text><text x="500" y="205" font-size="10" fill="#B04A5A">fixture 하나만</text><text x="500" y="222" font-size="10" fill="#B04A5A">demo에서 허용</text>
  <path d="M226 156 H250" fill="none" stroke="#3F8F72" stroke-width="3" marker-end="url(#ah-allow)"/><text x="238" y="144" text-anchor="middle" font-size="9" fill="#3F8F72">허용</text><path d="M226 204 V262 H452 V204 H474" fill="none" stroke="#B04A5A" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#ah-deny)"/><text x="350" y="282" text-anchor="middle" font-size="9.5" fill="#7A2734">docs 밖이면 거부</text>
</svg>
