  <path d="M554 102 L558 106 L554 110" fill="none" data-stroke-role="data-line" stroke="#636A75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="564" y="86" width="92" height="40" rx="9" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="610.0" y="106.0" font-size="11.5" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="middle" dominant-baseline="central">답</text>
  <path d="M502.0 128 L502.0 144 L178.0 144 L178.0 130" fill="none" data-stroke-role="api-line" stroke="#5B54A8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-api-line-1_5)"/>
  <text x="296.0" y="156" font-size="9.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">반복 (상한까지)</text>
  <rect x="24" y="190" width="140" height="56" rx="9" data-fill-role="danger-fill" fill="#F9ECEA" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="1" />
  <text x="94.0" y="210.25" font-size="11" font-weight="700" data-fill-role="danger-ink" fill="#6E2F28" text-anchor="middle" dominant-baseline="central">③ 무한 반복</text>
  <text x="94.0" y="223.75" font-size="9.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">루프(상한·반복 감지)</text>
  <path d="M178.0 160 L178.0 184" fill="none" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="1.5" marker-end="url(#ah-danger-line-1_5)"/>
  <rect x="176" y="190" width="130" height="56" rx="9" data-fill-role="danger-fill" fill="#F9ECEA" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="1" />
  <text x="241.0" y="210.25" font-size="11" font-weight="700" data-fill-role="danger-ink" fill="#6E2F28" text-anchor="middle" dominant-baseline="central">① 잘못된 인자</text>
  <text x="241.0" y="223.75" font-size="9.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">도구 구현(검증)</text>
  <path d="M286.0 160 L286.0 184" fill="none" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="1.5" marker-end="url(#ah-danger-line-1_5)"/>
  <rect x="318" y="190" width="170" height="56" rx="9" data-fill-role="danger-fill" fill="#F9ECEA" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="1" />
  <text x="403.0" y="210.25" font-size="11" font-weight="700" data-fill-role="danger-ink" fill="#6E2F28" text-anchor="middle" dominant-baseline="central">④ 도구 오류 → 지어냄</text>
  <text x="403.0" y="223.75" font-size="9.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">정직한 오류 + 루프 + 프롬프트</text>
  <path d="M394.0 160 L394.0 184" fill="none" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="1.5" marker-end="url(#ah-danger-line-1_5)"/>
  <rect x="500" y="190" width="156" height="56" rx="9" data-fill-role="danger-fill" fill="#F9ECEA" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="1" />
  <text x="578.0" y="210.25" font-size="11" font-weight="700" data-fill-role="danger-ink" fill="#6E2F28" text-anchor="middle" dominant-baseline="central">② 문서 속 지시</text>
  <text x="578.0" y="223.75" font-size="9.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">구현(경로) + 집합(읽기 전용)</text>
  <path d="M502.0 160 L502.0 184" fill="none" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="1.5" marker-end="url(#ah-danger-line-1_5)"/>
  <text x="340" y="276" font-size="11" font-weight="700" data-fill-role="ink" fill="#252B35" text-anchor="middle" dominant-baseline="central">네 줄 모두에서 프롬프트는 보조 — 경계가 코드에 있어야 &quot;모델이 설득당해도&quot; 안전하다</text>
  <text x="340.0" y="304" font-size="11" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">쓰기·실행 도구를 붙이는 순간 모든 행에 &quot;사람 확인&quot;이 추가된다</text>
</svg>
