<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>네 시나리오가 공격하는 지점</title>
  <desc>네 시나리오가 agent 루프의 어느 지점을 공격하는지 — 도구 인자(①), 도구가 읽은 문서 속 지시(②), 루프 반복(③), 도구 오류(④) — 와 각 지점을 막는 겹을 표시한 지도.</desc>
  <defs><marker id="ah-api-line-1_5" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="6.75" markerHeight="6.75" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 2 L10 6 L2 10" fill="none" data-stroke-role="api-line" stroke="#5B54A8" stroke-width="2" stroke-linecap="round"/></marker><marker id="ah-danger-line-1_5" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="6.75" markerHeight="6.75" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 2 L10 6 L2 10" fill="none" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="2" stroke-linecap="round"/></marker><marker id="ah-data-line-1_5" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="6.75" markerHeight="6.75" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 2 L10 6 L2 10" fill="none" data-stroke-role="data-line" stroke="#636A75" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect x="0" y="0" width="680" height="330" data-fill-role="surface" fill="#FFFFFF"/>
  <rect x="24" y="13" width="3" height="22" rx="1.5" data-fill-role="focus" fill="#2E6DA4" />
  <text x="36" y="24" font-size="18" font-weight="700" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">경계를 일부러 넘어 본다 — 네 사건과 막는 겹</text>
  <text x="36" y="46" font-size="11.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">판정: 모델이 시도했는가 · 도구가 거부했는가 · 답이 정직한가</text>
  <rect x="24" y="86" width="92" height="40" rx="9" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="data-line" stroke="#636A75" stroke-width="1" />
  <text x="70.0" y="106.0" font-size="11.5" font-weight="700" data-fill-role="data-ink" fill="#363A40" text-anchor="middle" dominant-baseline="central">질문</text>
  <path d="M122 102 L126 106 L122 110" fill="none" data-stroke-role="data-line" stroke="#636A75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="132" y="86" width="92" height="40" rx="9" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="api-line" stroke="#5B54A8" stroke-width="1" />
  <text x="178.0" y="106.0" font-size="11.5" font-weight="700" data-fill-role="api-ink" fill="#322E5C" text-anchor="middle" dominant-baseline="central">모델</text>
  <path d="M230 102 L234 106 L230 110" fill="none" data-stroke-role="data-line" stroke="#636A75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="240" y="86" width="92" height="40" rx="9" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="api-line" stroke="#5B54A8" stroke-width="1" />
  <text x="286.0" y="106.0" font-size="11.5" font-weight="700" data-fill-role="api-ink" fill="#322E5C" text-anchor="middle" dominant-baseline="central">tool_calls</text>
  <path d="M338 102 L342 106 L338 110" fill="none" data-stroke-role="data-line" stroke="#636A75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="348" y="86" width="92" height="40" rx="9" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="394.0" y="106.0" font-size="11.5" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="middle" dominant-baseline="central">도구 실행</text>
  <path d="M446 102 L450 106 L446 110" fill="none" data-stroke-role="data-line" stroke="#636A75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
