  <text x="588.0" y="220.0" font-size="12" font-weight="700" data-fill-role="api-ink" fill="#322E5C" text-anchor="middle" dominant-baseline="central">게이트웨이</text>
  <text x="588.0" y="234.0" font-size="10" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">인증 · 라우팅</text>
  <text x="588.0" y="248.0" font-size="10" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">키 관리 · 로그</text>
