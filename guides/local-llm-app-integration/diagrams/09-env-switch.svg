  <text x="360.0" y="176.0" font-size="10" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">vllm.internal:8000/v1 · 서빙 모델</text>
  <rect x="240" y="214" width="240" height="52" rx="9" data-fill-role="api-fill" fill="#EFEEF6" data-stroke-role="api-line" stroke="#5B54A8" stroke-width="1" />
