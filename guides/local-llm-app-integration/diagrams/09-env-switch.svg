  <text x="340.0" y="302" font-size="11" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">전환 전후를 같은 골든셋으로 비교 · endpoint별 부가 기능(구조화 출력·tool)이 같은지 확인</text>
