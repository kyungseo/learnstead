<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>모델 호출의 네 가지 실패</title>
  <desc>모델 호출의 실패를 연결 실패, 요청 거부, 잘린·빈 응답, 성공했는데 틀림 네 칸으로 나누고 각각의 감지 방법과 대응을 표시한 지도. 앞 둘은 예외로 드러나고 뒤 둘은 코드가 직접 봐야 한다.</desc>

  <rect x="0" y="0" width="680" height="330" data-fill-role="surface" fill="#FFFFFF"/>
  <rect x="24" y="13" width="3" height="22" rx="1.5" data-fill-role="focus" fill="#2E6DA4" />
  <text x="36" y="24" font-size="18" font-weight="700" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">HTTP 200이 &quot;맞다&quot;를 뜻하지 않는다</text>
  <text x="36" y="46" font-size="11.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">앞 둘은 예외 · 뒤 둘은 코드가 직접 본다</text>
  <rect x="24" y="74" width="308" height="96" rx="10" data-fill-role="warning-fill" fill="#FAF3E6" data-stroke-role="warning-line" stroke="#B08434" stroke-width="1" />
  <text x="38" y="94" font-size="12.5" font-weight="700" data-fill-role="warning-ink" fill="#6B4F1A" text-anchor="start" dominant-baseline="central">연결 실패</text>
  <text x="38" y="118" font-size="10.5" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">감지: APIConnectionError · 타임아웃</text>
  <text x="38" y="140" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">대응: 재시도(backoff, 상한) · runtime 확인</text>
  <rect x="348" y="74" width="308" height="96" rx="10" data-fill-role="warning-fill" fill="#FAF3E6" data-stroke-role="warning-line" stroke="#B08434" stroke-width="1" />
  <text x="362" y="94" font-size="12.5" font-weight="700" data-fill-role="warning-ink" fill="#6B4F1A" text-anchor="start" dominant-baseline="central">요청 거부 (4xx)</text>
  <text x="362" y="118" font-size="10.5" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">감지: 모델 없음 · 파라미터 · 인증 · context 초과</text>
  <text x="362" y="140" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">대응: 재시도 안 함 · 설정·입력 수정</text>
  <rect x="24" y="186" width="308" height="96" rx="10" data-fill-role="danger-fill" fill="#F9ECEA" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="1" />
  <text x="38" y="206" font-size="12.5" font-weight="700" data-fill-role="danger-ink" fill="#6E2F28" text-anchor="start" dominant-baseline="central">잘린 · 빈 응답</text>
  <text x="38" y="230" font-size="10.5" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">감지: finish_reason=length · content 빈값 · 파싱 실패</text>
  <text x="38" y="252" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">대응: max_tokens↑ · 이어쓰기 · 스키마</text>
  <rect x="348" y="186" width="308" height="96" rx="10" data-fill-role="danger-fill" fill="#F9ECEA" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="1" />
  <text x="362" y="206" font-size="12.5" font-weight="700" data-fill-role="danger-ink" fill="#6E2F28" text-anchor="start" dominant-baseline="central">성공했는데 틀림</text>
  <text x="362" y="230" font-size="10.5" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">감지: 환각 · 규칙 위반 · 잘못된 도구</text>
  <text x="362" y="252" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">대응: 검증 코드 · 골든셋 · 사람 — 자동으로 못 잡음</text>
  <text x="24" y="302" font-size="10.5" font-weight="700" data-fill-role="warning-ink" fill="#6B4F1A" text-anchor="start" dominant-baseline="central">예외로 드러남 ↑</text>
  <text x="656" y="302" font-size="10.5" font-weight="700" data-fill-role="danger-ink" fill="#6E2F28" text-anchor="end" dominant-baseline="central">코드가 직접 확인 ↑</text>
</svg>
