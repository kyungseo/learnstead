<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>모델을 띄운다는 것 — 1회 로드 후 상주</title>
  <desc>모델을 로드하면 가중치가 메모리에 상주하고, 이후 요청은 이를 이용해 토큰을 생성한다.</desc>
  <style>
    svg{ --bg:#FFFFFF; --ink:#1F2733; --muted:#5B6675; --hair:#D6E0EC;
      --edge-fill:#E8F1FB; --edge-line:#1F6FB2; --edge-ink:#124267;
      --data-fill:#F1F1EE; --data-line:#7A8398; --data-ink:#3F4453;
      --k8s-fill:#E7F5EF;  --k8s-line:#0F7A5F;  --k8s-ink:#085041;
      --band:#F4F8FC; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="11.25" markerHeight="11.25"
      markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#44546a" stroke-width="2" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="340" fill="var(--bg)"/>

  <!-- 밴드 1: 로드 -->
  <rect x="24" y="24" width="632" height="140" rx="14" fill="var(--band)" stroke="var(--hair)" stroke-width="1"/>
  <text x="42" y="48" font-size="14" font-weight="700" fill="var(--ink)" dominant-baseline="central">[모델 로드] storage에서 weight를 memory로 읽기</text>

  <rect x="60" y="66" width="200" height="76" rx="10" fill="#FFFFFF" stroke="var(--data-line)" stroke-width="1"/>
  <text x="160" y="93" font-size="13.5" font-weight="700" fill="var(--data-ink)" text-anchor="middle" dominant-baseline="central">디스크</text>
  <text x="160" y="115" font-size="12" fill="var(--muted)" text-anchor="middle" dominant-baseline="central">.gguf 파일 (예: ~8 GB)</text>

  <line x1="268" y1="104" x2="392" y2="104" stroke="#44546a" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="334" y="86" font-size="12" fill="var(--muted)" text-anchor="middle" dominant-baseline="central">읽기</text>

  <rect x="410" y="66" width="216" height="76" rx="10" fill="var(--edge-fill)" stroke="var(--edge-line)" stroke-width="1"/>
  <text x="518" y="93" font-size="13.5" font-weight="700" fill="var(--edge-ink)" text-anchor="middle" dominant-baseline="central">메모리 (VRAM / 통합메모리)</text>
  <text x="518" y="115" font-size="12" fill="var(--edge-ink)" text-anchor="middle" dominant-baseline="central">가중치가 상주 — 같은 ~8 GB 점유</text>

  <!-- 밴드 2: 추론 -->
  <rect x="24" y="184" width="632" height="132" rx="14" fill="var(--band)" stroke="var(--hair)" stroke-width="1"/>
  <text x="42" y="208" font-size="14" font-weight="700" fill="var(--ink)" dominant-baseline="central">[매 요청] 추론 — 상주 중인 가중치를 읽어 토큰을 만든다</text>

  <rect x="60" y="230" width="130" height="60" rx="10" fill="#FFFFFF" stroke="var(--k8s-line)" stroke-width="1"/>
  <text x="125" y="260" font-size="13.5" font-weight="700" fill="var(--k8s-ink)" text-anchor="middle" dominant-baseline="central">질문</text>

  <line x1="198" y1="260" x2="262" y2="260" stroke="#44546a" stroke-width="2.5" marker-end="url(#ah)"/>

  <rect x="280" y="230" width="196" height="60" rx="10" fill="var(--edge-fill)" stroke="var(--edge-line)" stroke-width="1"/>
  <text x="378" y="252" font-size="13.5" font-weight="700" fill="var(--edge-ink)" text-anchor="middle" dominant-baseline="central">메모리의 가중치</text>
  <text x="378" y="273" font-size="11.5" fill="var(--edge-ink)" text-anchor="middle" dominant-baseline="central">상주한 weight를 반복 사용</text>

  <line x1="484" y1="260" x2="536" y2="260" stroke="#44546a" stroke-width="2.5" marker-end="url(#ah)"/>

  <rect x="546" y="230" width="90" height="60" rx="10" fill="#FFFFFF" stroke="var(--k8s-line)" stroke-width="1"/>
  <text x="591" y="260" font-size="13.5" font-weight="700" fill="var(--k8s-ink)" text-anchor="middle" dominant-baseline="central">답변</text>
</svg>
