<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>hosted와 local 실행, 그리고 hybrid 선택지</title>
  <desc>hosted와 local은 모델 실행 위치를 구분한다. 조직은 workload에 따라 직접 관리하는 모델과 외부 API를 함께 쓸 수 있지만, 별도의 라우팅과 통제가 필요하다.</desc>
  <style>
    svg{ --bg:#FFFFFF; --ink:#1F2733; --muted:#5B6675; --hair:#D6E0EC;
      --edge-fill:#E8F1FB; --edge-line:#1F6FB2; --edge-ink:#124267;
      --api-fill:#ECEBFB;  --api-line:#534AB7;  --api-ink:#3C3489;
      --k8s-fill:#E7F5EF;  --k8s-line:#0F7A5F;  --k8s-ink:#085041;
      --data-fill:#F1F1EE; --data-line:#7A8398; --data-ink:#3F4453;
      --band:#F4F8FC; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="10" markerHeight="10"
      markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#44546a" stroke-width="2" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="480" fill="var(--bg)"/>

  <!-- hosted 패널 -->
  <rect x="24" y="24" width="304" height="180" rx="14" fill="var(--band)" stroke="var(--hair)" stroke-width="1"/>
  <text x="42" y="48" font-size="14" font-weight="700" fill="var(--edge-ink)" dominant-baseline="central">hosted LLM — 상용 API·서비스</text>
  <rect x="46" y="66" width="110" height="46" rx="9" fill="#FFFFFF" stroke="var(--data-line)" stroke-width="1"/>
  <text x="101" y="89" font-size="12.5" font-weight="700" fill="var(--data-ink)" text-anchor="middle" dominant-baseline="central">내 앱·브라우저</text>
  <line x1="164" y1="89" x2="192" y2="89" stroke="#44546a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <rect x="210" y="66" width="100" height="46" rx="9" fill="var(--edge-fill)" stroke="var(--edge-line)" stroke-width="1"/>
  <text x="260" y="83" font-size="12" font-weight="700" fill="var(--edge-ink)" text-anchor="middle" dominant-baseline="central">사업자 서버의</text>
  <text x="260" y="99" font-size="12" font-weight="700" fill="var(--edge-ink)" text-anchor="middle" dominant-baseline="central">모델</text>
  <text x="42" y="134" font-size="11.5" fill="var(--muted)" dominant-baseline="central">프롬프트·문서가 인터넷 너머로 나간다</text>
  <text x="42" y="154" font-size="11.5" fill="var(--muted)" dominant-baseline="central">쓴 만큼 종량 과금 (토큰 요금)</text>
  <text x="42" y="174" font-size="11.5" fill="var(--muted)" dominant-baseline="central">예: ChatGPT · Claude · Gemini API</text>

  <!-- local 패널 -->
  <rect x="352" y="24" width="304" height="180" rx="14" fill="var(--band)" stroke="var(--k8s-line)" stroke-width="1.6"/>
  <text x="370" y="48" font-size="14" font-weight="700" fill="var(--k8s-ink)" dominant-baseline="central">local LLM — 직접 실행 (이 가이드)</text>
  <rect x="374" y="66" width="110" height="46" rx="9" fill="#FFFFFF" stroke="var(--data-line)" stroke-width="1"/>
  <text x="429" y="89" font-size="12.5" font-weight="700" fill="var(--data-ink)" text-anchor="middle" dominant-baseline="central">내 앱·브라우저</text>
  <line x1="492" y1="89" x2="520" y2="89" stroke="#44546a" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="538" y="66" width="100" height="46" rx="9" fill="var(--k8s-fill)" stroke="var(--k8s-line)" stroke-width="1"/>
  <text x="588" y="83" font-size="12" font-weight="700" fill="var(--k8s-ink)" text-anchor="middle" dominant-baseline="central">내 장비의</text>
  <text x="588" y="99" font-size="12" font-weight="700" fill="var(--k8s-ink)" text-anchor="middle" dominant-baseline="central">모델</text>
  <text x="370" y="134" font-size="11.5" fill="var(--muted)" dominant-baseline="central">기본 추론은 직접 관리하는 환경에서 처리</text>
  <text x="370" y="154" font-size="11.5" fill="var(--muted)" dominant-baseline="central">장비·전력·운영의 고정비 (§4)</text>
  <text x="370" y="174" font-size="11.5" fill="var(--muted)" dominant-baseline="central">open-weight 가중치를 받아 메모리에 올린다</text>

  <!-- hybrid 밴드 -->
  <rect x="24" y="224" width="632" height="196" rx="14" fill="var(--api-fill)" stroke="var(--api-line)" stroke-width="1"/>
  <text x="42" y="248" font-size="14" font-weight="700" fill="var(--api-ink)" dominant-baseline="central">hybrid — workload별로 두 실행 위치를 함께 쓰는 구성</text>

  <rect x="46" y="292" width="110" height="48" rx="9" fill="#FFFFFF" stroke="var(--data-line)" stroke-width="1"/>
  <text x="101" y="316" font-size="12.5" font-weight="700" fill="var(--data-ink)" text-anchor="middle" dominant-baseline="central">사내 앱들</text>

  <line x1="164" y1="316" x2="196" y2="316" stroke="#44546a" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="214" y="292" width="150" height="48" rx="9" fill="#FFFFFF" stroke="var(--api-line)" stroke-width="1.4"/>
  <text x="289" y="309" font-size="12.5" font-weight="700" fill="var(--api-ink)" text-anchor="middle" dominant-baseline="central">게이트웨이</text>
  <text x="289" y="327" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="central">요청 성격에 따라 라우팅</text>

  <path d="M372 304 Q400 288 424 282" fill="none" stroke="#44546a" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M372 328 Q400 344 424 350" fill="none" stroke="#44546a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/>

  <rect x="440" y="258" width="198" height="46" rx="9" fill="var(--k8s-fill)" stroke="var(--k8s-line)" stroke-width="1"/>
  <text x="539" y="275" font-size="12" font-weight="700" fill="var(--k8s-ink)" text-anchor="middle" dominant-baseline="central">local 모델</text>
  <text x="539" y="292" font-size="11" fill="var(--k8s-ink)" text-anchor="middle" dominant-baseline="central">예: 승인된 민감 workload</text>

  <rect x="440" y="330" width="198" height="46" rx="9" fill="var(--edge-fill)" stroke="var(--edge-line)" stroke-width="1"/>
  <text x="539" y="347" font-size="12" font-weight="700" fill="var(--edge-ink)" text-anchor="middle" dominant-baseline="central">hosted API</text>
  <text x="539" y="364" font-size="11" fill="var(--edge-ink)" text-anchor="middle" dominant-baseline="central">예: local 미지원 기능</text>

  <text x="42" y="398" font-size="11.5" fill="var(--api-ink)" dominant-baseline="central">비슷한 HTTP API가 연결을 단순화할 수 있지만 routing·인증·log·장애 대응은 별도로 설계한다</text>

  <text x="24" y="452" font-size="11.5" fill="var(--muted)" dominant-baseline="central">이 가이드의 범위는 초록 상자의 모델을 실행하고 기본 API로 확인하는 지점까지</text>
</svg>
