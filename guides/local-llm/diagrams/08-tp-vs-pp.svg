<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>텐서 병렬(TP) vs 파이프라인 병렬(PP)</title>
  <desc>TP는 모든 레이어를 카드들이 나눠 계산하며 매 레이어 통신이 필요하고, PP는 레이어 구간을 카드에 배치해 통신은 적지만 버블이 생긴다.</desc>
  <style>
    svg{ --bg:#FFFFFF; --ink:#1F2733; --muted:#5B6675; --hair:#D6E0EC;
      --edge-fill:#E8F1FB; --edge-line:#1F6FB2; --edge-ink:#124267;
      --k8s-fill:#E7F5EF;  --k8s-line:#0F7A5F;  --k8s-ink:#085041;
      --band:#F4F8FC; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="10" markerHeight="10"
      markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#44546a" stroke-width="2" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="400" fill="var(--bg)"/>

  <!-- TP 밴드 -->
  <rect x="24" y="24" width="632" height="164" rx="14" fill="var(--band)" stroke="var(--hair)" stroke-width="1"/>
  <text x="42" y="48" font-size="14" font-weight="700" fill="var(--ink)" dominant-baseline="central">텐서 병렬 (Tensor Parallel, TP) — tensor 연산 분할</text>
  <!-- 4 cards: start=54, w=136, gap=14 → 54+3*150+136=640 -->
  <g>
    <rect x="54"  y="66" width="136" height="62" rx="10" fill="var(--edge-fill)" stroke="var(--edge-line)" stroke-width="1"/>
    <rect x="204" y="66" width="136" height="62" rx="10" fill="var(--edge-fill)" stroke="var(--edge-line)" stroke-width="1"/>
    <rect x="354" y="66" width="136" height="62" rx="10" fill="var(--edge-fill)" stroke="var(--edge-line)" stroke-width="1"/>
    <rect x="504" y="66" width="136" height="62" rx="10" fill="var(--edge-fill)" stroke="var(--edge-line)" stroke-width="1"/>
    <text x="122" y="88"  font-size="12.5" font-weight="700" fill="var(--edge-ink)" text-anchor="middle" dominant-baseline="central">GPU 0</text>
    <text x="122" y="109" font-size="11.5" fill="var(--edge-ink)" text-anchor="middle" dominant-baseline="central">모든 레이어의 1/4</text>
    <text x="272" y="88"  font-size="12.5" font-weight="700" fill="var(--edge-ink)" text-anchor="middle" dominant-baseline="central">GPU 1</text>
    <text x="272" y="109" font-size="11.5" fill="var(--edge-ink)" text-anchor="middle" dominant-baseline="central">모든 레이어의 1/4</text>
    <text x="422" y="88"  font-size="12.5" font-weight="700" fill="var(--edge-ink)" text-anchor="middle" dominant-baseline="central">GPU 2</text>
    <text x="422" y="109" font-size="11.5" fill="var(--edge-ink)" text-anchor="middle" dominant-baseline="central">모든 레이어의 1/4</text>
    <text x="572" y="88"  font-size="12.5" font-weight="700" fill="var(--edge-ink)" text-anchor="middle" dominant-baseline="central">GPU 3</text>
    <text x="572" y="109" font-size="11.5" fill="var(--edge-ink)" text-anchor="middle" dominant-baseline="central">모든 레이어의 1/4</text>
  </g>
  <!-- 통신 표시: 카드 사이 양방향 짧은 선 -->
  <g stroke="#44546a" stroke-width="1.6" stroke-dasharray="4 3">
    <line x1="190" y1="97" x2="204" y2="97"/>
    <line x1="340" y1="97" x2="354" y2="97"/>
    <line x1="490" y1="97" x2="504" y2="97"/>
  </g>
  <text x="42" y="150" font-size="11.5" fill="var(--muted)" dominant-baseline="central">layer마다 collective 통신 — topology와 bandwidth가 성능에 영향</text>
  <text x="42" y="170" font-size="11.5" fill="var(--muted)" dominant-baseline="central">head 수 등 model·runtime 제약을 기동 전에 확인 (§2)</text>

  <!-- PP 밴드 -->
  <rect x="24" y="208" width="632" height="164" rx="14" fill="var(--band)" stroke="var(--hair)" stroke-width="1"/>
  <text x="42" y="232" font-size="14" font-weight="700" fill="var(--ink)" dominant-baseline="central">파이프라인 병렬 (Pipeline Parallel, PP) — layer 구간 분할</text>
  <!-- 4 cards with arrows: start=54, w=124, gap=28 → 54+3*152+124=634 -->
  <g>
    <rect x="54"  y="250" width="124" height="62" rx="10" fill="var(--k8s-fill)" stroke="var(--k8s-line)" stroke-width="1"/>
    <rect x="206" y="250" width="124" height="62" rx="10" fill="var(--k8s-fill)" stroke="var(--k8s-line)" stroke-width="1"/>
    <rect x="358" y="250" width="124" height="62" rx="10" fill="var(--k8s-fill)" stroke="var(--k8s-line)" stroke-width="1"/>
    <rect x="510" y="250" width="124" height="62" rx="10" fill="var(--k8s-fill)" stroke="var(--k8s-line)" stroke-width="1"/>
    <text x="116" y="272" font-size="12.5" font-weight="700" fill="var(--k8s-ink)" text-anchor="middle" dominant-baseline="central">GPU 0</text>
    <text x="116" y="293" font-size="11.5" fill="var(--k8s-ink)" text-anchor="middle" dominant-baseline="central">레이어 1~20</text>
    <text x="268" y="272" font-size="12.5" font-weight="700" fill="var(--k8s-ink)" text-anchor="middle" dominant-baseline="central">GPU 1</text>
    <text x="268" y="293" font-size="11.5" fill="var(--k8s-ink)" text-anchor="middle" dominant-baseline="central">레이어 21~40</text>
    <text x="420" y="272" font-size="12.5" font-weight="700" fill="var(--k8s-ink)" text-anchor="middle" dominant-baseline="central">GPU 2</text>
    <text x="420" y="293" font-size="11.5" fill="var(--k8s-ink)" text-anchor="middle" dominant-baseline="central">레이어 41~60</text>
    <text x="572" y="272" font-size="12.5" font-weight="700" fill="var(--k8s-ink)" text-anchor="middle" dominant-baseline="central">GPU 3</text>
    <text x="572" y="293" font-size="11.5" fill="var(--k8s-ink)" text-anchor="middle" dominant-baseline="central">레이어 61~80</text>
  </g>
  <g stroke="#44546a" stroke-width="2">
    <line x1="182" y1="281" x2="196" y2="281" marker-end="url(#ah)"/>
    <line x1="334" y1="281" x2="348" y2="281" marker-end="url(#ah)"/>
    <line x1="486" y1="281" x2="500" y2="281" marker-end="url(#ah)"/>
  </g>
  <text x="42" y="334" font-size="11.5" fill="var(--muted)" dominant-baseline="central">stage 경계에서 통신 · scheduling에 따라 기다리는 "버블"이 생길 수 있다</text>
  <text x="42" y="354" font-size="11.5" fill="var(--muted)" dominant-baseline="central">TP·PP 조합은 GPU 수·memory balance·topology·workload로 결정</text>
</svg>
