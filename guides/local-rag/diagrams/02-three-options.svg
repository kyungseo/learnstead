  <rect x="24" y="278" width="104" height="36" rx="8" data-fill-role="data-fill" fill="#F4F5F5" />
  <text x="76" y="296.0" font-size="12" font-weight="700" data-fill-role="data-ink" fill="#363A40" text-anchor="middle" dominant-baseline="central">비용이 드는 곳</text>
  <rect x="152" y="278" width="152" height="36" rx="8" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="edge-line" stroke="#2E6DA4" stroke-width="1" />
