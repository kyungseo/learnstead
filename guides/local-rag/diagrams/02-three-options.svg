  <rect x="328" y="278" width="152" height="36" rx="8" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="api-line" stroke="#5B54A8" stroke-width="1" />
  <text x="404" y="296.0" font-size="11.5" data-fill-role="ink" fill="#252B35" text-anchor="middle" dominant-baseline="central">매 질문 입력 토큰</text>
  <rect x="504" y="278" width="152" height="36" rx="8" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="data-line" stroke="#636A75" stroke-width="1" />
  <text x="580" y="296.0" font-size="11.5" data-fill-role="ink" fill="#252B35" text-anchor="middle" dominant-baseline="central">GPU 학습·데이터 준비</text>
