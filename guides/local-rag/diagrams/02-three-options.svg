<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="680" height="350" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>RAG · Long Context · Fine-tuning 비교 매트릭스</title>
  <desc>세 방법을 문서 규모, 갱신 빈도, 출처 추적, 비용 축으로 비교한다. RAG는 규모·갱신·출처에 강하고, Long Context는 문서가 적을 때 단순하며, Fine-tuning은 사실 주입보다 행동 교정에 적합하다.</desc>

  <rect x="0" y="0" width="680" height="350" data-fill-role="surface" fill="#FFFFFF"/>
  <rect x="24" y="13" width="3" height="22" rx="1.5" data-fill-role="focus" fill="#2E6DA4" />
  <text x="36" y="24" font-size="18" font-weight="700" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">세 방법은 다른 문제를 푼다</text>
  <text x="36" y="46" font-size="11.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">사실은 RAG가, 분량은 context가, 말투는 fine-tuning이 담당한다</text>
