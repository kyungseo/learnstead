<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>조각 수에 따른 저장소 선택</title>
  <desc>조각이 수천 개 이하이면 Python 리스트 완전 탐색, 수만~수십만이면 파일 기반 임베디드 vector store, 그 이상이거나 필터·hybrid·다중 사용자가 필요하면 서버형 vector database를 고른다. 이미 PostgreSQL을 운영 중이면 pgvector가 흔한 선택이다.</desc>
  <defs><marker id="ah-data-line-2" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9.0" markerHeight="9.0" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 2 L10 6 L2 10" fill="none" data-stroke-role="data-line" stroke="#636A75" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect x="0" y="0" width="680" height="300" data-fill-role="surface" fill="#FFFFFF"/>
  <rect x="24" y="13" width="3" height="22" rx="1.5" data-fill-role="focus" fill="#2E6DA4" />
  <text x="36" y="24" font-size="18" font-weight="700" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">vector store는 규모가 요구할 때 도입한다</text>
  <text x="36" y="46" font-size="11.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">판단 기준 = 조각 수 · 이미 운영 중인 인프라 · 필요한 필터/hybrid 기능</text>
  <line x1="40" y1="120" x2="640" y2="120" data-stroke-role="data-line" stroke="#636A75" stroke-width="2"/>
  <path d="M600 120 L640 120" fill="none" data-stroke-role="data-line" stroke="#636A75" stroke-width="2" marker-end="url(#ah-data-line-2)"/>
  <text x="40" y="104" font-size="11" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">조각 수 →</text>
  <line x1="40" y1="114" x2="40" y2="126" data-stroke-role="data-line" stroke="#636A75" stroke-width="1.5"/>
  <text x="40" y="138" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">수백</text>
  <line x1="240" y1="114" x2="240" y2="126" data-stroke-role="data-line" stroke="#636A75" stroke-width="1.5"/>
  <text x="240" y="138" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">수천</text>
  <line x1="440" y1="114" x2="440" y2="126" data-stroke-role="data-line" stroke="#636A75" stroke-width="1.5"/>
  <text x="440" y="138" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">수십만</text>
  <line x1="600" y1="114" x2="600" y2="126" data-stroke-role="data-line" stroke="#636A75" stroke-width="1.5"/>
  <text x="600" y="138" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">수백만+</text>
  <rect x="40" y="158" width="196" height="66" rx="9" data-fill-role="data-fill" fill="#F4F5F5" data-stroke-role="data-line" stroke="#636A75" stroke-width="1" />
  <text x="138.0" y="175.5" font-size="12.5" font-weight="700" data-fill-role="data-ink" fill="#363A40" text-anchor="middle" dominant-baseline="central">Python 리스트 + 코사인</text>
  <text x="138.0" y="190.0" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">의존성 없음 · 완전 탐색</text>
  <text x="138.0" y="204.5" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">학습·실험 · 튜토리얼</text>
  <rect x="252" y="158" width="196" height="66" rx="9" data-fill-role="edge-fill" fill="#EAF0F6" data-stroke-role="edge-line" stroke="#2E6DA4" stroke-width="1" />
  <text x="350.0" y="175.5" font-size="12.5" font-weight="700" data-fill-role="edge-ink" fill="#193C5A" text-anchor="middle" dominant-baseline="central">임베디드 vector store</text>
  <text x="350.0" y="190.0" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">Chroma · LanceDB</text>
  <text x="350.0" y="204.5" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">서버 없이 파일로 · pip 한 줄</text>
  <rect x="464" y="158" width="176" height="66" rx="9" data-fill-role="api-fill" fill="#EFEEF6" data-stroke-role="api-line" stroke="#5B54A8" stroke-width="1" />
  <text x="552.0" y="175.5" font-size="12.5" font-weight="700" data-fill-role="api-ink" fill="#322E5C" text-anchor="middle" dominant-baseline="central">서버형 vector DB</text>
  <text x="552.0" y="190.0" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">Qdrant · Milvus 등</text>
  <text x="552.0" y="204.5" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">필터 · sparse · 다중 사용자</text>
  <rect x="40" y="240" width="600" height="36" rx="9" data-fill-role="compute-fill" fill="#ECF4F1" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="340.0" y="258.0" font-size="11.5" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="middle" dominant-baseline="central">이미 PostgreSQL 운영 중 → pgvector: 기존 DB에 확장으로 추가, 권한·백업을 DB가 담당</text>
</svg>
