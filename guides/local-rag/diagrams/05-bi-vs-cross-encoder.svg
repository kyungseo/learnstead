  <text x="616.0" y="150.0" font-size="12" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="middle" dominant-baseline="central">점수</text>
  <path d="M578 150 L586 150" fill="none" data-stroke-role="api-line" stroke="#5B54A8" stroke-width="2" marker-end="url(#ah-api-line-2)"/>
  <text x="504" y="222" font-size="10.5" data-fill-role="api-ink" fill="#322E5C" text-anchor="middle" dominant-baseline="central">조각마다 모델 실행 · 정확 · 후보 20~50개만</text>
</svg>
