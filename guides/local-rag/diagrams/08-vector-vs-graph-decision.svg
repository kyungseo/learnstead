<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>벡터 · 그래프 · 결합 선택 매트릭스</title>
  <desc>질문 유형(단일 사실, multi-hop, 전체 요약)과 문서의 관계 밀도를 축으로, 벡터 RAG만으로 충분한 영역, 그래프 local search를 더할 영역, global 요약을 검토할 영역을 나눈다. 실제 질문과 데이터 구조를 기준으로 선택한다.</desc>

  <rect x="0" y="0" width="680" height="330" data-fill-role="surface" fill="#FFFFFF"/>
  <rect x="24" y="13" width="3" height="22" rx="1.5" data-fill-role="focus" fill="#2E6DA4" />
  <text x="36" y="24" font-size="18" font-weight="700" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">질문과 데이터 구조로 벡터·그래프·결합을 고른다</text>
  <text x="36" y="46" font-size="11.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">질문 묶음 20개를 모아 보고 판단한다</text>
  <text x="230.0" y="82" font-size="11.5" font-weight="700" data-fill-role="ink" fill="#252B35" text-anchor="middle" dominant-baseline="central">단일 사실 조회</text>
  <text x="398.0" y="82" font-size="11.5" font-weight="700" data-fill-role="ink" fill="#252B35" text-anchor="middle" dominant-baseline="central">관계 연쇄 (multi-hop)</text>
  <text x="566.0" y="82" font-size="11.5" font-weight="700" data-fill-role="ink" fill="#252B35" text-anchor="middle" dominant-baseline="central">전체 요약·집계</text>
  <text x="138" y="142.0" font-size="11.5" font-weight="700" data-fill-role="ink" fill="#252B35" text-anchor="end" dominant-baseline="central">관계가 성긴 문서</text>
  <text x="138" y="230.0" font-size="11.5" font-weight="700" data-fill-role="ink" fill="#252B35" text-anchor="end" dominant-baseline="central">관계가 촘촘한 문서</text>
  <rect x="150" y="102" width="160" height="80" rx="9" data-fill-role="compute-fill" fill="#ECF4F1" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="230.0" y="133.75" font-size="12" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="middle" dominant-baseline="central">벡터·hybrid</text>
  <text x="230.0" y="148.25" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">◎ 충분</text>
  <rect x="318" y="102" width="160" height="80" rx="9" data-fill-role="warning-fill" fill="#FAF3E6" data-stroke-role="warning-line" stroke="#B08434" stroke-width="1" />
  <text x="398.0" y="133.75" font-size="12" font-weight="700" data-fill-role="warning-ink" fill="#6B4F1A" text-anchor="middle" dominant-baseline="central">벡터 + top-k↑</text>
  <text x="398.0" y="148.25" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">△ 조각이 흩어지면 한계</text>
  <rect x="486" y="102" width="160" height="80" rx="9" data-fill-role="danger-fill" fill="#F9ECEA" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="1" />
  <text x="566.0" y="133.75" font-size="12" font-weight="700" data-fill-role="danger-ink" fill="#6E2F28" text-anchor="middle" dominant-baseline="central">벡터 ×</text>
  <text x="566.0" y="148.25" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">창 초과</text>
  <rect x="150" y="190" width="160" height="80" rx="9" data-fill-role="compute-fill" fill="#ECF4F1" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="230.0" y="221.75" font-size="12" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="middle" dominant-baseline="central">벡터·hybrid</text>
  <text x="230.0" y="236.25" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">◎ 여전히 충분</text>
  <rect x="318" y="190" width="160" height="80" rx="9" data-fill-role="edge-fill" fill="#EAF0F6" data-stroke-role="edge-line" stroke="#2E6DA4" stroke-width="1" />
  <text x="398.0" y="221.75" font-size="12" font-weight="700" data-fill-role="edge-ink" fill="#193C5A" text-anchor="middle" dominant-baseline="central">+ 그래프 local</text>
  <text x="398.0" y="236.25" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">◎ 실습 ⑤</text>
  <rect x="486" y="190" width="160" height="80" rx="9" data-fill-role="api-fill" fill="#EFEEF6" data-stroke-role="api-line" stroke="#5B54A8" stroke-width="1" />
  <text x="566.0" y="221.75" font-size="12" font-weight="700" data-fill-role="api-ink" fill="#322E5C" text-anchor="middle" dominant-baseline="central">+ global 요약</text>
  <text x="566.0" y="236.25" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">○ 색인 비용 먼저 추정</text>
  <text x="24" y="284" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">질문 유형 →</text>
  <text x="340.0" y="312" font-size="11" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">로컬 소형 모델: 벡터 ◎ · local ○ · global △ (추출·요약 품질이 모델 크기에 좌우)</text>
</svg>
