<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>RAG 평가의 세 층</title>
  <desc>검색 지표(recall·precision), 생성 지표(faithfulness·relevance), 종단 지표(만족·재질문)가 층으로 쌓이고, 골든셋이 앞 두 층을 자동으로 돌린다. 검색과 생성을 따로 재야 왜 나빠졌는지 알 수 있다.</desc>
  <defs><marker id="ah-data-line-2" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9.0" markerHeight="9.0" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 2 L10 6 L2 10" fill="none" data-stroke-role="data-line" stroke="#636A75" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect x="0" y="0" width="680" height="300" data-fill-role="surface" fill="#FFFFFF"/>
  <rect x="24" y="13" width="3" height="22" rx="1.5" data-fill-role="focus" fill="#2E6DA4" />
  <text x="36" y="24" font-size="18" font-weight="700" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">검색과 생성을 따로 잰다 — 종단 점수만으로는 원인을 모른다</text>
  <text x="36" y="46" font-size="11.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">골든셋(질문 + 정답 조각) 20문항이면 시작할 수 있다</text>
  <rect x="24" y="206" width="440" height="50" rx="10" data-fill-role="compute-fill" fill="#ECF4F1" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="40" y="231" font-size="13" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="start" dominant-baseline="central">종단</text>
  <text x="96" y="222" font-size="11" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">사용자가 만족했는가</text>
  <text x="96" y="240" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">피드백 버튼 · 재질문율</text>
  <rect x="24" y="146" width="440" height="50" rx="10" data-fill-role="api-fill" fill="#EFEEF6" data-stroke-role="api-line" stroke="#5B54A8" stroke-width="1" />
  <text x="40" y="171" font-size="13" font-weight="700" data-fill-role="api-ink" fill="#322E5C" text-anchor="start" dominant-baseline="central">생성</text>
  <text x="96" y="162" font-size="11" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">faithfulness(근거 충실) · relevance(질문에 답함)</text>
  <text x="96" y="180" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">사람 채점 또는 LLM 판정자</text>
  <rect x="24" y="86" width="440" height="50" rx="10" data-fill-role="edge-fill" fill="#EAF0F6" data-stroke-role="edge-line" stroke="#2E6DA4" stroke-width="1" />
  <text x="40" y="111" font-size="13" font-weight="700" data-fill-role="edge-ink" fill="#193C5A" text-anchor="start" dominant-baseline="central">검색</text>
  <text x="96" y="102" font-size="11" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">recall@k(정답 조각 포함) · precision(관련 비율)</text>
  <text x="96" y="120" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">골든셋으로 자동 계산</text>
  <rect x="488" y="86" width="168" height="110" rx="10" data-fill-role="data-fill" fill="#F4F5F5" data-stroke-role="data-line" stroke="#636A75" stroke-width="1" />
  <text x="572" y="106" font-size="12.5" font-weight="700" data-fill-role="data-ink" fill="#363A40" text-anchor="middle" dominant-baseline="central">골든셋</text>
  <text x="572" y="128.25" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">질문 20~50개</text>
  <text x="572" y="142.75" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">+ 정답 조각 ID</text>
  <text x="572" y="157.25" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">+ &quot;문서에 없는 질문&quot; 5개</text>
  <text x="572" y="171.75" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">→ 앞 두 층을 자동 반복</text>
  <path d="M486 141 L470 141" fill="none" data-stroke-role="data-line" stroke="#636A75" stroke-width="2" marker-end="url(#ah-data-line-2)"/>
  <text x="340.0" y="280" font-size="11" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">청킹을 바꿨는데 recall↓ → 청킹 문제 · recall 같은데 faithfulness↓ → 프롬프트·모델 문제 (08 진단표와 동일)</text>
</svg>
