  <title>개인 RAG와 기업 RAG — 같은 뼈대, 더해지는 부품</title>
  <desc>개인 RAG는 문서 폴더·스크립트·로컬 모델로 이루어지고, 기업 RAG는 같은 뼈대 위에 수집 파이프라인, 권한 필터, hybrid 검색·reranker, 게이트웨이, 평가·관측, 감사 로그가 더해진다.</desc>
