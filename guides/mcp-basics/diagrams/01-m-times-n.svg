  <rect x="530" y="195" width="110" height="36" rx="9" data-fill-role="compute-fill" fill="#FFFFFF" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="585" y="213" font-size="11" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="middle" dominant-baseline="central">DB 서버</text>
  <text x="504" y="262" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">client 3 + server 2 = 5개 표준 구현</text>
  <text x="340.0" y="308" font-size="11" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">실행 연결은 필요한 만큼 맺지만, 각 host와 도구가 같은 규약을 한 번씩만 구현한다</text>
