  <line x1="136" y1="231" x2="160" y2="231" data-stroke-role="data-line" stroke="#636A75" stroke-width="1"/>
  <rect x="236" y="214" width="68" height="34" rx="10" data-fill-role="compute-fill" fill="#FFFFFF" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="270" y="231" font-size="10" data-fill-role="compute-ink" fill="#234F3F" text-anchor="middle" dominant-baseline="central">DB 질의</text>
