<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>요청의 네 조각</title>
  <desc>지금 상태·원하는 결과·확인 방법·하지 말 것 네 조각으로 요청을 구성하면 결과를 판정하고 변경 범위를 지키기 쉬워진다. 확인 방법이 없으면 완료 여부를 AI의 보고에만 기대게 된다.</desc>

  <rect x="0" y="0" width="680" height="300" data-fill-role="surface" fill="#FFFFFF"/>
  <rect x="24" y="13" width="3" height="22" rx="1.5" data-fill-role="focus" fill="#2E6DA4" />
  <text x="36" y="24" font-size="18" font-weight="700" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">좋은 요청은 네 조각으로 되어 있다</text>
  <text x="36" y="46" font-size="11.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">&quot;이걸 어떻게 확인하지?&quot;에 답할 수 없으면 아직 요청이 아니다</text>
  <rect x="24" y="76" width="92" height="44" rx="8" data-fill-role="data-fill" fill="#F4F5F5" data-stroke-role="data-line" stroke="#636A75" stroke-width="1" />
  <text x="70" y="98" font-size="12" font-weight="700" data-fill-role="data-ink" fill="#363A40" text-anchor="middle" dominant-baseline="central">① 지금</text>
  <rect x="126" y="76" width="316" height="44" rx="8" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="data-line" stroke="#636A75" stroke-width="1" />
  <text x="138" y="98" font-size="10.5" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">할 일 화면이 있고 추가 버튼이 동작해</text>
  <rect x="452" y="76" width="204" height="44" rx="8" data-fill-role="data-fill" fill="#F4F5F5" />
  <text x="464" y="98" font-size="10" data-fill-role="data-ink" fill="#363A40" text-anchor="start" dominant-baseline="central">없으면: 엉뚱한 파일을 고침</text>
  <rect x="24" y="128" width="92" height="44" rx="8" data-fill-role="edge-fill" fill="#EAF0F6" data-stroke-role="edge-line" stroke="#2E6DA4" stroke-width="1" />
  <text x="70" y="150" font-size="12" font-weight="700" data-fill-role="edge-ink" fill="#193C5A" text-anchor="middle" dominant-baseline="central">② 원하는</text>
  <rect x="126" y="128" width="316" height="44" rx="8" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="edge-line" stroke="#2E6DA4" stroke-width="1" />
  <text x="138" y="150" font-size="10.5" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">클릭하면 취소선이 그어지게 해 줘</text>
  <rect x="452" y="128" width="204" height="44" rx="8" data-fill-role="edge-fill" fill="#EAF0F6" />
  <text x="464" y="150" font-size="10" data-fill-role="edge-ink" fill="#193C5A" text-anchor="start" dominant-baseline="central">없으면: 결과가 매번 달라짐</text>
  <rect x="24" y="180" width="92" height="44" rx="8" data-fill-role="compute-fill" fill="#ECF4F1" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="70" y="202" font-size="12" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="middle" dominant-baseline="central">③ 확인</text>
  <rect x="126" y="180" width="316" height="44" rx="8" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="138" y="202" font-size="10.5" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">2개 중 하나만 클릭해 그것만 취소선이면 성공</text>
  <rect x="452" y="180" width="204" height="44" rx="8" data-fill-role="compute-fill" fill="#ECF4F1" />
  <text x="464" y="202" font-size="10" data-fill-role="compute-ink" fill="#234F3F" text-anchor="start" dominant-baseline="central">없으면: 안 된 걸 모름</text>
  <rect x="24" y="232" width="92" height="44" rx="8" data-fill-role="warning-fill" fill="#FAF3E6" data-stroke-role="warning-line" stroke="#B08434" stroke-width="1" />
  <text x="70" y="254" font-size="12" font-weight="700" data-fill-role="warning-ink" fill="#6B4F1A" text-anchor="middle" dominant-baseline="central">④ 하지마</text>
  <rect x="126" y="232" width="316" height="44" rx="8" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="warning-line" stroke="#B08434" stroke-width="1" />
  <text x="138" y="254" font-size="10.5" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">삭제 기능과 디자인은 건드리지 마</text>
  <rect x="452" y="232" width="204" height="44" rx="8" data-fill-role="warning-fill" fill="#FAF3E6" />
  <text x="464" y="254" font-size="10" data-fill-role="warning-ink" fill="#6B4F1A" text-anchor="start" dominant-baseline="central">없으면: 요청 안 한 게 늘어남</text>
  <text x="340" y="292" font-size="11" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="middle" dominant-baseline="central">③ 확인 방법이 없으면 &quot;됐다&quot;는 AI의 보고에만 기대게 된다</text>
</svg>
