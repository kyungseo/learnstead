<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>세 종류의 멈춤</title>
  <desc>오늘은 여기까지·이 방법은 접기·사람을 찾기 세 종류의 멈춤은 신호와 다음 행동이 각각 다르다. 돈·개인정보·인증·법·안전이 걸린 영역에서는 AI를 더 밀어붙이지 않고 사람을 찾는다.</desc>

  <rect x="0" y="0" width="680" height="330" data-fill-role="surface" fill="#FFFFFF"/>
  <rect x="24" y="13" width="3" height="22" rx="1.5" data-fill-role="focus" fill="#2E6DA4" />
  <text x="36" y="24" font-size="18" font-weight="700" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">멈출 때는 다음 행동을 먼저 고른다</text>
  <text x="36" y="46" font-size="11.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">확인 가능한 진전이 없으면 멈추고 기록·방법 변경·전문가 검토 중 하나를 고른다</text>
  <rect x="24" y="74" width="200" height="158" rx="10" data-fill-role="compute-fill" fill="#ECF4F1" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="124" y="96" font-size="12" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="middle" dominant-baseline="central">① 오늘은 여기까지</text>
  <line x1="40" y1="112" x2="208" y2="112" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1"/>
  <text x="44" y="132" font-size="10" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">· 같은 실수 반복</text>
  <text x="44" y="152" font-size="10" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">· 짜증이 난다</text>
  <text x="44" y="172" font-size="10" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">· 확인을 건너뛴다</text>
  <rect x="40" y="196" width="168" height="24" rx="5" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="124" y="208" font-size="9.5" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="middle" dominant-baseline="central">확인 → 저장 판단 → 기록</text>
  <rect x="240" y="74" width="200" height="158" rx="10" data-fill-role="warning-fill" fill="#FAF3E6" data-stroke-role="warning-line" stroke="#B08434" stroke-width="1" />
  <text x="340" y="96" font-size="12" font-weight="700" data-fill-role="warning-ink" fill="#6B4F1A" text-anchor="middle" dominant-baseline="central">② 이 방법은 접기</text>
  <line x1="256" y1="112" x2="424" y2="112" data-stroke-role="warning-line" stroke="#B08434" stroke-width="1"/>
  <text x="260" y="132" font-size="10" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">· 네 탈출을 다 씀</text>
  <text x="260" y="152" font-size="10" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">· 새 대화도 같음</text>
  <text x="260" y="172" font-size="10" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">· 되돌려도 같음</text>
  <rect x="256" y="196" width="168" height="24" rx="5" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="warning-line" stroke="#B08434" stroke-width="1" />
  <text x="340" y="208" font-size="9.5" font-weight="700" data-fill-role="warning-ink" fill="#6B4F1A" text-anchor="middle" dominant-baseline="central">목표 유지, 방법 변경</text>
  <rect x="456" y="74" width="200" height="158" rx="10" data-fill-role="danger-fill" fill="#F9ECEA" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="1" />
  <text x="556" y="96" font-size="12" font-weight="700" data-fill-role="danger-ink" fill="#6E2F28" text-anchor="middle" dominant-baseline="central">③ 사람을 찾기</text>
  <line x1="472" y1="112" x2="640" y2="112" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="1"/>
  <text x="476" y="132" font-size="10" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">· 돈·개인정보</text>
  <text x="476" y="152" font-size="10" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">· 인증·권한·법</text>
  <text x="476" y="172" font-size="10" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">· 안전·되돌릴 수 없음</text>
  <rect x="472" y="196" width="168" height="24" rx="5" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="1" />
  <text x="556" y="208" font-size="9.5" font-weight="700" data-fill-role="danger-ink" fill="#6E2F28" text-anchor="middle" dominant-baseline="central">전문가 검토 / 기성 서비스</text>
  <rect x="24" y="248" width="632" height="56" rx="12" data-fill-role="danger-fill" fill="#F9ECEA" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="1" />
  <text x="340" y="268" font-size="11" font-weight="700" data-fill-role="danger-ink" fill="#6E2F28" text-anchor="middle" dominant-baseline="central">③ 에서는 AI가 그럴듯한 코드를 만들어 내지만 맞는지 판단할 사람이 없다</text>
  <text x="340" y="290" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">&quot;동작한다&quot;와 &quot;안전하다&quot;는 다르다</text>
  <text x="340.0" y="318" font-size="11" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">접어도 기록은 남는다 — &quot;이 방법으로는 안 된다&quot;를 알아낸 것이 다음 판단의 근거다</text>
</svg>
