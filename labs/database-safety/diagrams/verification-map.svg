<svg xmlns="http://www.w3.org/2000/svg" width="680" height="632" viewBox="0 0 680 632" font-family="Pretendard, Inter, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" role="img" aria-labelledby="title desc"><title id="title">성공 화면만으로 완료를 판단하지 않는다</title><desc id="desc">의도적으로 만든 실패 사례를 기준 결과와 비교합니다.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9.9" markerHeight="9.9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#2E6DA4" data-stroke-role="edge-line" stroke-width="2" stroke-linecap="round"/></marker></defs><rect width="680" height="632" fill="#F7F7F5" data-fill-role="canvas"/><text x="32" y="38" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#636A75" data-fill-role="muted">LEARNSTEAD · DATABASE</text><text x="32" y="70" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central" fill="#252B35" data-fill-role="ink">성공 화면만으로 완료를 판단하지 않는다</text><text x="32" y="100" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#636A75" data-fill-role="muted">의도적으로 만든 실패 사례를 기준 결과와 비교합니다.</text><rect x="32" y="142" width="616" height="88" rx="16" fill="#FFFFFF" data-fill-role="surface" stroke="#DEE0E2" data-stroke-role="rule" stroke-width="1"/><text x="58" y="170" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="central" fill="#2E6DA4" data-fill-role="focus">01</text><text x="112" y="170" font-size="20" font-weight="700" text-anchor="start" dominant-baseline="central" fill="#252B35" data-fill-role="ink">관찰</text><text x="112" y="201" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#636A75" data-fill-role="muted">화면·응답·DB의 실제 상태를 확인</text><path d="M340 238 L340 264" fill="none" stroke="#2E6DA4" data-stroke-role="edge-line" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="32" y="274" width="616" height="88" rx="16" fill="#FFFFFF" data-fill-role="surface" stroke="#DEE0E2" data-stroke-role="rule" stroke-width="1"/><text x="58" y="302" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="central" fill="#2E6DA4" data-fill-role="focus">02</text><text x="112" y="302" font-size="20" font-weight="700" text-anchor="start" dominant-baseline="central" fill="#252B35" data-fill-role="ink">판정</text><text x="112" y="333" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#636A75" data-fill-role="muted">기대 결과와 비교하고 실패 원인을 좁힘</text><path d="M340 370 L340 396" fill="none" stroke="#2E6DA4" data-stroke-role="edge-line" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="32" y="406" width="616" height="88" rx="16" fill="#FFFFFF" data-fill-role="surface" stroke="#DEE0E2" data-stroke-role="rule" stroke-width="1"/><text x="58" y="434" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="central" fill="#2E6DA4" data-fill-role="focus">03</text><text x="112" y="434" font-size="20" font-weight="700" text-anchor="start" dominant-baseline="central" fill="#252B35" data-fill-role="ink">복구와 재확인</text><text x="112" y="465" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#636A75" data-fill-role="muted">초기화하거나 복원한 뒤 같은 검사를 반복</text><text x="32" y="557" font-size="19" font-weight="700" text-anchor="start" dominant-baseline="central" fill="#252B35" data-fill-role="ink">저장 · 제약 · 동시성 · 권한 · 변경 · 복원</text><text x="32" y="592" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#636A75" data-fill-role="muted">여섯 상황 모두 같은 관찰과 판정의 순서로 연습합니다.</text></svg>