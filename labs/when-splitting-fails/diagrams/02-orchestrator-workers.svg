  <title>오케스트레이터-워커 구조</title>
  <desc>코드가 문서별 작업을 고정해 워커들에게 분배하고 모델이 결과를 취합한다. 2026-08-30 요약 과제의 입력은 휴가 229, 장비 196, 회의실 204, 취합 339다. 전체 시간은 동시 호출 8.7초, 순차 6.6초였으며 9월 6일 재측정은 본문에 있다.</desc>
