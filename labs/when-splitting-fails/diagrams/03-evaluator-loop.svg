<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img"
  style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <title>평가-개선 루프와 수렴 실패</title>
  <desc>평가 기준과 개선 여부를 확인하며 반복한다. 2026-08-30 사실 질문은 1회 통과하고 입력 1043토큰을 사용했다. 안내문 과제는 3회 상한에 도달하고 입력 4339토큰을 사용했다. 이 결과는 일반적 수렴 보장이 아니다.</desc>
  <defs><marker id="ah-compute-line-2_5" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="11.25" markerHeight="11.25" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 2 L10 6 L2 10" fill="none" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="2" stroke-linecap="round"/></marker><marker id="ah-danger-line-2_5" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="11.25" markerHeight="11.25" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 2 L10 6 L2 10" fill="none" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="2" stroke-linecap="round"/></marker></defs>
  <rect x="0" y="0" width="680" height="330" data-fill-role="surface" fill="#FFFFFF"/>
  <rect x="24" y="13" width="3" height="22" rx="1.5" data-fill-role="focus" fill="#2E6DA4" />
  <text x="36" y="24" font-size="18" font-weight="700" data-fill-role="ink" fill="#252B35" text-anchor="start" dominant-baseline="central">평가 기준과 실제 개선 여부를 함께 확인한다</text>
  <text x="36" y="46" font-size="11.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">작성·평가를 반복하되 라운드·예산 중단 기준을 둔다</text>
  <rect x="60" y="100" width="120" height="50" rx="9" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="120.0" y="125.0" font-size="12.5" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="middle" dominant-baseline="central">작성</text>
  <rect x="280" y="100" width="120" height="50" rx="9" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="warning-line" stroke="#B08434" stroke-width="1" />
  <text x="340.0" y="125.0" font-size="12.5" font-weight="700" data-fill-role="warning-ink" fill="#6B4F1A" text-anchor="middle" dominant-baseline="central">평가</text>
  <path d="M182 125 L276 125" fill="none" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="2.5" marker-end="url(#ah-compute-line-2_5)"/>
  <text x="229" y="110" font-size="10" data-fill-role="muted" fill="#636A75" text-anchor="middle" dominant-baseline="central">초안</text>
  <rect x="500" y="100" width="120" height="50" rx="9" data-fill-role="surface" fill="#FFFFFF" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="560.0" y="125.0" font-size="12.5" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="middle" dominant-baseline="central">초안 반환</text>
  <path d="M402 125 L496 125" fill="none" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="2.5" marker-end="url(#ah-compute-line-2_5)"/>
  <text x="449" y="110" font-size="10" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="middle" dominant-baseline="central">pass = true</text>
  <path d="M340 152 L340 186 L120 186 L120 154" fill="none" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="2.5" marker-end="url(#ah-danger-line-2_5)"/>
  <text x="230" y="202" font-size="11" font-weight="700" data-fill-role="danger-ink" fill="#6E2F28" text-anchor="middle" dominant-baseline="central">pass = false → 지적과 함께 재작성</text>
  <rect x="24" y="222" width="304" height="84" rx="12" data-fill-role="compute-fill" fill="#ECF4F1" data-stroke-role="compute-line" stroke="#3F8F72" stroke-width="1" />
  <text x="40" y="240" font-size="13" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="start" dominant-baseline="central">사실 질문 (1회 통과)</text>
  <text x="40" y="254" font-size="10.5" data-fill-role="compute-ink" fill="#234F3F" text-anchor="start" dominant-baseline="central">&quot;규정에 없는 숫자를 말했는가&quot;</text>
  <text x="40" y="274" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">→ 1라운드 통과 · 호출 2회 · 입력 1,043토큰</text>
  <text x="40" y="292" font-size="10" font-weight="700" data-fill-role="compute-ink" fill="#234F3F" text-anchor="start" dominant-baseline="central">코드로 잴 수 있으면 코드로 잰다</text>
  <rect x="352" y="222" width="304" height="84" rx="12" data-fill-role="danger-fill" fill="#F9ECEA" data-stroke-role="danger-line" stroke="#B45A50" stroke-width="1" />
  <text x="368" y="240" font-size="13" font-weight="700" data-fill-role="danger-ink" fill="#6E2F28" text-anchor="start" dominant-baseline="central">안내문 과제 (상한 도달)</text>
  <text x="368" y="254" font-size="10.5" data-fill-role="danger-ink" fill="#6E2F28" text-anchor="start" dominant-baseline="central">&quot;충분히 설명했는가&quot;</text>
  <text x="368" y="274" font-size="10.5" data-fill-role="muted" fill="#636A75" text-anchor="start" dominant-baseline="central">→ 상한 3회 도달 · 호출 7회 · 입력 4,339토큰</text>
  <text x="368" y="292" font-size="10" font-weight="700" data-fill-role="danger-ink" fill="#6E2F28" text-anchor="start" dominant-baseline="central">문구 반복 감지는 발동하지 않았다</text>
</svg>
