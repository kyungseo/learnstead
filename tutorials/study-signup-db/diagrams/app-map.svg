<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" font-family="Pretendard, Inter, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" role="img" aria-labelledby="title desc"><title id="title">작은 앱에서도 권한은 서버에서 지킨다</title><desc id="desc">로컬 Supabase로 연습하며 클라우드 운영 검증과 구분합니다.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9.9" markerHeight="9.9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#2E6DA4" data-stroke-role="edge-line" stroke-width="2" stroke-linecap="round"/></marker></defs><rect width="680" height="540" fill="#F7F7F5" data-fill-role="canvas"/><text x="32" y="38" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#636A75" data-fill-role="muted">LEARNSTEAD · DATABASE</text><text x="32" y="70" font-size="24" font-weight="700" text-anchor="start" dominant-baseline="central" fill="#252B35" data-fill-role="ink">작은 앱에서도 권한은 서버에서 지킨다</text><text x="32" y="100" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#636A75" data-fill-role="muted">로컬 Supabase로 연습하며 클라우드 운영 검증과 구분합니다.</text><rect x="32" y="154" width="168" height="178" rx="16" fill="#FFFFFF" data-fill-role="surface" stroke="#DEE0E2" data-stroke-role="rule" stroke-width="1"/><circle cx="116" cy="198" r="27" fill="#EAF0F6" data-fill-role="icon-tint"/><path d="M8 11 A3 3 0 1 0 8 5 A3 3 0 1 0 8 11 M2 20 A6 6 0 0 1 14 20 M16 6 A3 3 0 0 1 16 11 M15 20 A6 6 0 0 0 22 20" transform="translate(100 182) scale(1.333333)" fill="none" stroke="#2E6DA4" data-stroke-role="edge-line" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="116" y="246" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#252B35" data-fill-role="ink">웹 화면</text><text x="116" y="279" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#636A75" data-fill-role="muted">로그인 · 모임 목록</text><text x="116" y="303" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#636A75" data-fill-role="muted">신청 · 취소</text><path d="M209 242 L246 242" fill="none" stroke="#2E6DA4" data-stroke-role="edge-line" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="256" y="154" width="168" height="178" rx="16" fill="#FFFFFF" data-fill-role="surface" stroke="#DEE0E2" data-stroke-role="rule" stroke-width="1"/><circle cx="340" cy="198" r="27" fill="#EAF0F6" data-fill-role="icon-tint"/><path d="M6 11 H18 V20 H6 Z M9 11 V8 A3 3 0 0 1 15 8 V11" transform="translate(324 182) scale(1.333333)" fill="none" stroke="#2E6DA4" data-stroke-role="edge-line" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="340" y="246" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#252B35" data-fill-role="ink">Supabase</text><text x="340" y="279" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#636A75" data-fill-role="muted">Auth · API</text><text x="340" y="303" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#636A75" data-fill-role="muted">요청자의 권한</text><path d="M433 242 L470 242" fill="none" stroke="#2E6DA4" data-stroke-role="edge-line" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="480" y="154" width="168" height="178" rx="16" fill="#FFFFFF" data-fill-role="surface" stroke="#DEE0E2" data-stroke-role="rule" stroke-width="1"/><circle cx="564" cy="198" r="27" fill="#EAF0F6" data-fill-role="icon-tint"/><path d="M4 6 A8 3 0 1 0 20 6 A8 3 0 1 0 4 6 M4 6 V18 A8 3 0 0 0 20 18 V6" transform="translate(548 182) scale(1.333333)" fill="none" stroke="#2E6DA4" data-stroke-role="edge-line" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="564" y="246" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#252B35" data-fill-role="ink">PostgreSQL</text><text x="564" y="279" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#636A75" data-fill-role="muted">모임 · 신청 내역</text><text x="564" y="303" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#636A75" data-fill-role="muted">중복 · 정원 규칙</text><text x="32" y="368" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="central" fill="#252B35" data-fill-role="ink">확인할 결과</text><text x="32" y="395" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#636A75" data-fill-role="muted">다른 사용자와 비로그인 요청으로 읽기·쓰기 범위를 확인합니다.</text><text x="32" y="438" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="central" fill="#252B35" data-fill-role="ink">연습 데이터만 사용</text><text x="32" y="465" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#636A75" data-fill-role="muted">컨테이너와 초기화 명령은 이 실습의 별도 환경을 대상으로 합니다.</text></svg>